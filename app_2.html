<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Opening FlavorNest | KiddoSprout</title>
  <link rel="canonical" href="recipe.html">
  <link rel="icon" type="image/png" href="kiddosprout_logo_128.png">
  <script>
    (function () {
      "use strict";
      const localHosts = new Set(["localhost", "127.0.0.1", "0.0.0.0"]);
      const useDockerPreview = window.location.protocol === "http:"
        && localHosts.has(window.location.hostname)
        && window.location.port !== "8001";
      const destination = useDockerPreview
        ? new URL("/recipe.html", "http://127.0.0.1:8001")
        : new URL("recipe.html", window.location.href);
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.href);
    }());
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=recipe.html"></noscript>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f4faf7;
      --surface: #ffffff;
      --text: #12202b;
      --muted: #53677a;
      --line: #cbded7;
      --link: #0f7772;
      --focus: #5b3a82;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      color: var(--text);
      background: var(--page-bg);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 520px);
      padding: clamp(24px, 7vw, 42px);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 18px 44px rgb(18 32 43 / 0.12);
      text-align: center;
    }

    h1 { margin: 0; font-size: clamp(26px, 7vw, 38px); }
    p { margin: 14px 0 0; color: var(--muted); line-height: 1.55; }
    a { color: var(--link); font-weight: 800; }
    a:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page-bg: #071c24;
        --surface: #102934;
        --text: #edf8fa;
        --muted: #bdd0d6;
        --line: #365762;
        --link: #8ee7d7;
        --focus: #ffda7b;
      }

      main { box-shadow: 0 18px 44px rgb(0 0 0 / 0.32); }
    }
  </style>
</head>
<body>
  <main>
    <h1>Opening FlavorNest…</h1>
    <p role="status">This older recipe address now opens the current app. If it does not open, <a href="recipe.html">open FlavorNest</a>.</p>
  </main>
</body>
</html>
