map $uri $kiddosprout_cache_control {
  default "no-cache, must-revalidate";
  ~^/healthz(?:\?|$) "no-store";
  ~^/supabase-config\.js(?:\?|$) "no-store, no-cache, must-revalidate, max-age=0";
  ~^/service-worker\.js(?:\?|$) "no-store, no-cache, must-revalidate, max-age=0";
  ~^/api/ "no-store";
  "~^/(?:recipe-catalog-v[0-9a-f]{12}\.js|family-tech-hub-v[0-9a-f]{12}\.(?:avif|jpe?g|webp)|assets/story-[a-z0-9-]+-v[0-9a-f]{12}\.webp)$" "public, max-age=31536000, immutable";
}

map $uri $kiddosprout_referrer_policy {
  default "strict-origin-when-cross-origin";
  ~^/api/ "no-referrer";
}

map $uri $kiddosprout_content_security_policy {
  # Trusted inline code is still present in the application, but external
  # scripts and frames are limited to the two providers the UI actually uses.
  # Supabase, recipe metadata, and Plaid API hosts are connection-only; HTTPS
  # images/audio remain available for recipe, avatar, and story media.
  default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://cdn.plaid.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co http://127.0.0.1:* ws://127.0.0.1:* http://localhost:* ws://localhost:* https://www.themealdb.com https://en.wikipedia.org https://production.plaid.com https://sandbox.plaid.com https://development.plaid.com; frame-src https://challenges.cloudflare.com https://cdn.plaid.com; worker-src 'self'; manifest-src 'self'; font-src 'self'";
  # API responses are data, audio, or downloads and never need an executable
  # document context. Keep their policy stricter than the browser application.
  ~^/api/ "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
}

map $http_x_forwarded_proto $kiddosprout_forwarded_proto {
  default $scheme;
  ~^https?$ $http_x_forwarded_proto;
}

# HSTS is meaningful only on the public HTTPS origin. Leaving this empty for
# direct HTTP/localhost responses avoids teaching a development browser that a
# plain local address is HTTPS-only.
map $kiddosprout_forwarded_proto $kiddosprout_hsts {
  default "";
  https "max-age=31536000";
}

# Do not write callback codes, tokens, or other query values to Docker logs.
log_format kiddosprout_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
  listen 80;
  listen [::]:80;
  server_name _;
  server_tokens off;
  access_log /var/log/nginx/access.log kiddosprout_safe;

  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;
  client_max_body_size 32k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 10s;
  keepalive_requests 100;
  send_timeout 60s;
  reset_timedout_connection on;

  # Compress only static browser document types. API JSON is intentionally not
  # listed so private account or bank responses are never compressed here.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css application/javascript application/manifest+json image/svg+xml;

  # The internal services also defend themselves when tested directly. Hide
  # their overlapping fields at the reverse proxy so public responses carry a
  # single, unambiguous nginx policy instead of comma-merged cache directives.
  proxy_hide_header Cache-Control;
  proxy_hide_header Pragma;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Cross-Origin-Resource-Policy;
  proxy_hide_header Content-Security-Policy;
  # The internal APIs authenticate only with their explicit Bearer header.
  # Do not copy unrelated browser cookies or page URLs into private services.
  proxy_set_header Cookie "";
  proxy_set_header Referer "";

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy $kiddosprout_referrer_policy always;
  add_header X-Frame-Options "DENY" always;
  # same-origin-allow-popups preserves Google OAuth and Plaid Link while
  # isolating this page from unrelated browsing-context groups.
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  # Creator Studio deliberately uses the camera, microphone, and screen-share
  # APIs. Keep those self-hosted capabilities while denying location access.
  add_header Permissions-Policy "camera=(self), display-capture=(self), geolocation=(), microphone=(self)" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  add_header Strict-Transport-Security $kiddosprout_hsts always;
  # Trusted inline scripts/styles remain temporarily allowed, while arbitrary
  # external script execution, unsafe-eval, framing, and form exfiltration are
  # denied by the route-aware policy above.
  add_header Content-Security-Policy $kiddosprout_content_security_policy always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Cache-Control $kiddosprout_cache_control always;

  location = /healthz {
    access_log off;
    return 204;
  }

  location ~ /\.(?!well-known(?:/|$)) {
    return 404;
  }

  location = /api/story-voice {
    proxy_pass http://voice-api:8787/story-voice;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kiddosprout_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 150s;
    proxy_send_timeout 15s;
    proxy_buffering off;
  }

  location = /api/story-voices {
    proxy_pass http://voice-api:8787/story-voices;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kiddosprout_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location = /api/blocker/status {
    proxy_pass http://blocker-api:8788/status;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kiddosprout_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
  }

  location = /api/blocker/checksums {
    proxy_pass http://blocker-api:8788/checksums;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
  }

  location = /api/blocker/download/mac {
    proxy_pass http://blocker-api:8788/download/mac;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kiddosprout_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_buffering off;
  }

  location = /api/blocker/download/windows {
    proxy_pass http://blocker-api:8788/download/windows;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kiddosprout_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_buffering off;
  }

  location = /api/blocker/download/windows-arm64 {
    proxy_pass http://blocker-api:8788/download/windows-arm64;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kiddosprout_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_buffering off;
  }

  location = /api/bank/status {
    proxy_pass http://bank-api:8789/status;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kiddosprout_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
  }

  location = /api/bank/connect-demo {
    proxy_pass http://bank-api:8789/connect-demo;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kiddosprout_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
  }

  location = /api/bank/link-token {
    proxy_pass http://bank-api:8789/link-token;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kiddosprout_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location = /api/bank/exchange-public-token {
    proxy_pass http://bank-api:8789/exchange-public-token;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kiddosprout_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location = /api/bank/accounts {
    proxy_pass http://bank-api:8789/accounts;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kiddosprout_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  location = /api/bank/disconnect {
    proxy_pass http://bank-api:8789/disconnect;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kiddosprout_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }

  # This file is generated from container environment variables at startup.
  # Never let a browser reuse account or CAPTCHA settings from an older container.
  location = /supabase-config.js {
    try_files $uri =404;
  }

  # Browsers must always revalidate the worker so an older cache strategy cannot linger.
  location = /service-worker.js {
    try_files $uri =404;
  }

  # nginx's stock MIME table does not consistently know the PWA extension.
  # Keep nosniff enabled while serving the manifest with the type browsers expect.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # This file configures Cloudflare's static uploader; it is not website content.
  location = /_headers {
    return 404;
  }

  # Art-generation notes are local production files, never browser content.
  # Keep this guard even when a stale image was built before .dockerignore changed.
  location ~* \.json$ {
    return 404;
  }

  # Mutable names (including manually versioned CSS/JS queries) revalidate.
  # Only content-addressed image derivatives are safe to cache immutably.
  location ~* \.(?:avif|css|gif|html|jpe?g|js|png|svg|webmanifest|webp)$ {
    try_files $uri =404;
  }

  # Only browser image types are useful below /assets. Refuse production notes,
  # sidecar files, and future unknown formats even if they enter a stale image.
  location /assets/ {
    return 404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
