async function handleLogout() {
  const accessToken = state.session?.access_token;
  authOperationRevision += 1;
  recoveryOperationRevision += 1;
  recipeLoadRevision += 1;
  recipeMutationRevision += 1;
  clearPersistedSession();
  state.session = null;
  state.authorizedOwnerId = "";
  kiddoSproutGate = null;
  state.readOnlyBrowse = false;
  state.recipesLoaded = false;
  state.recipeMode = "loading";
  state.recipeNotice = "";
  state.cloudErrorKind = "";
  state.cloudRecipes = [];
  state.recipes = [];
  state.screen = "browse";
  state.searchQuery = "";
  state.selectedCategory = "All";
  showAllRecipeCategories = false;
  editingRecipeBaseline = "";
  externalRecipeRefreshPending = false;
  if (externalRecipeRefreshTimer) window.clearTimeout(externalRecipeRefreshTimer);
  externalRecipeRefreshTimer = null;
  resetRecipePage();
  state.editingRecipeId = null;
  state.detailError = "";
  state.recoveryMode = false;
  state.recoveryAccessToken = "";
  state.recoveryEmailFingerprint = "";
  state.recoveryNonce = "";
  try { window.localStorage.removeItem(RECIPE_PASSWORD_RECOVERY_TRANSACTION_KEY); } catch (error) {}
  render();
  if (accessToken && SUPABASE_CONNECTED) {
    try {
      await fetch(`${SUPABASE_URL}/auth/v1/logout?scope=local`, {
        method: "POST",
        headers: {
          apikey: SUPABASE_PUBLISHABLE_KEY,
          Authorization: `Bearer ${accessToken}`
        },
        cache: "no-store",
        signal: authRequestSignal(5000)
      });
    } catch (error) {
      // Local session data is already cleared; remote expiry remains the fallback.
    }
  }
}

function focusAfterRender(selector) {
  window.requestAnimationFrame(() => {
    const target = document.querySelector(selector);
    if (!target) return;
    try { target.focus({ preventScroll: true }); } catch (error) { target.focus(); }
  });
}

function focusRecipeCardAfterRender(recipeId) {
  window.requestAnimationFrame(() => {
    const target = Array.from(document.querySelectorAll(".recipe-card"))
      .find((card) => card.getAttribute("data-recipe-id") === recipeId)
      || document.getElementById("recipe-results-summary");
    if (!target) return;
    target.focus();
  });
}

function openRecipe(id) {
  if (!state.recipes.some((recipe) => recipe.id === id)) return;
  if (state.screen === "browse") {
    browseReturnRecipeId = id;
    state.recipeActionNotice = "";
  }
  state.selectedRecipeId = id;
  state.detailError = "";
  state.detailSubmitting = false;
  state.screen = "detail";
  render();
  window.scrollTo(0, 0);
  focusAfterRender(".detail-title");
}

function backToBrowse(options = {}) {
  const recipeId = browseReturnRecipeId || state.selectedRecipeId || "";
  state.screen = "browse";
  state.selectedRecipeId = null;
  state.editingRecipeId = null;
  state.detailError = "";
  render();
  if (options.focusSummary) focusAfterRender("#recipe-results-summary");
  else focusRecipeCardAfterRender(recipeId);
}

function cancelRecipeEditor() {
  const recipeId = state.editingRecipeId;
  state.addError = "";
  state.addSubmitting = false;
  state.editingRecipeId = null;
  editingRecipeBaseline = "";
  if (recipeId && state.recipes.some((recipe) => recipe.id === recipeId)) {
    state.selectedRecipeId = recipeId;
    state.screen = "detail";
    render();
    focusAfterRender(".detail-title");
    flushExternalRecipeRefresh();
    return;
  }
  backToBrowse();
  flushExternalRecipeRefresh();
}

function openAddForm() {
  if (!canWriteRecipes()) return;
  state.addForm = { title: "", category: "", ingredients: [""], steps: [""] };
  state.addError = "";
  state.addSubmitting = false;
  state.recipeActionNotice = "";

function openEditForm() {

  render();
  window.scrollTo(0, 0);
  focusAfterRender("#recipe-title-input");
}

function friendlyRecipeMutationError(error) {
  const kind = String(error?.kind || "");
  if (kind === "validation" || kind === "not_found") return error.message;
  if (kind === "conflict") return "This recipe changed in another tab. Your draft is still here; review the latest recipe, then apply your changes again.";
  if (kind === "schema_missing") return "Family recipe storage has not been installed yet, so this recipe was not saved.";
  if (kind === "auth") return "Your recipe session has expired. Log out and back in before saving.";
  if (kind === "session_refresh_unavailable") return "The account service cannot be reached right now. Your recipe draft is still here; try saving again when the connection returns.";
  if (kind === "permission") return "This recipe could not be changed because the family storage permissions need attention.";
  if (kind === "network" || kind === "timeout" || kind === "unavailable") return "Cloud recipes cannot be reached right now. Nothing was saved; please try again later.";
  return "This recipe could not be saved safely. Please try again.";
}

function showRecipeEditorError(message, selector) {
  state.addError = message;
  render();
  focusAfterRender(selector);
}

async function recheckRecipeMutationRule(expectedOwnerId) {
  const allowed = await canOpenKiddoSproutApp("recipe", APP_NAME, expectedOwnerId);
  if (allowed) return true;

  // A save or removal may have remained open while a parent changed the rule.
  // Drop private recipe data before leaving the freshly rendered gate visible.
  recipeLoadRevision += 1;
  recipeMutationRevision += 1;
  state.authorizedOwnerId = "";
  state.cloudRecipes = [];
  state.recipes = [];
  state.recipesLoaded = false;
  state.selectedRecipeId = null;
  state.editingRecipeId = null;
  editingRecipeBaseline = "";
  state.detailSubmitting = false;
  state.addSubmitting = false;
  closeRecipeDeleteDialog();
  render();
  return false;
}

async function submitAddForm() {
  if (!canWriteRecipes() || state.addSubmitting) return;
  const draft = {
    title: state.addForm.title,
    category: state.addForm.category,
    ingredients: state.addForm.ingredients.slice(),
    steps: state.addForm.steps.slice()
  };
  const title = draft.title.trim();
  const category = draft.category.trim();
  const ingredients = draft.ingredients.map((s) => s.trim()).filter(Boolean);
  const steps = draft.steps.map((s) => s.trim()).filter(Boolean);

  if (!title) { showRecipeEditorError("Please give the recipe a name.", "#recipe-title-input"); return; }
  if (ingredients.length === 0) { showRecipeEditorError("Add at least one ingredient.", ".ingredient-input"); return; }
  if (steps.length === 0) { showRecipeEditorError("Add at least one step.", ".step-input"); return; }
  let recipeInput;
  try {
    recipeInput = window.KiddoSproutRecipeCloud.normalizeRecipeInput({ title, category, ingredients, steps });
  } catch (error) {
    showRecipeEditorError(friendlyRecipeMutationError(error), "#recipe-editor-error");
    return;
  }

  if (canWriteDemoRecipes()) {
    state.addSubmitting = true;
    state.addError = "";
    state.recipeActionNotice = "";
    const editingRecipeId = state.editingRecipeId;
    const nextRecipes = state.demoRecipes.slice();
    let savedRecipe;
    let duplicate = false;
    if (editingRecipeId) {
      const editIndex = nextRecipes.findIndex((recipe) => recipe.id === editingRecipeId);
      if (editIndex < 0) {
        state.addSubmitting = false;
        showRecipeEditorError("That practice recipe is no longer in this tab.", "#recipe-editor-error");
        return;
      }
      savedRecipe = { id: editingRecipeId, ...recipeInput, _source: "demo" };
      nextRecipes[editIndex] = savedRecipe;
    } else {
      const fingerprint = recipeContentFingerprint(recipeInput);
      const existing = nextRecipes.find((recipe) => recipeContentFingerprint(recipe) === fingerprint);
      if (existing) {
        savedRecipe = existing;
        duplicate = true;
      } else {
        if (nextRecipes.length >= RECIPE_DEMO_MAX_ROWS) {
          state.addSubmitting = false;
          showRecipeEditorError(`This practice recipe book can hold ${RECIPE_DEMO_MAX_ROWS} recipes. Remove one before adding another.`, "#recipe-editor-error");
          return;
        }
        savedRecipe = { id: demoRecipeId(), ...recipeInput, _source: "demo" };
        nextRecipes.push(savedRecipe);
      }
    }
    if (!writeDemoRecipes(nextRecipes)) {
      state.addSubmitting = false;
      showRecipeEditorError("This browser could not keep the practice recipe in this tab. Check private-browsing or storage settings and try again.", "#recipe-editor-error");
      return;
    }
    state.demoRecipes = nextRecipes.map(normalizeStoredDemoRecipe).filter(Boolean);
    state.recipes = mergeDemoRecipes(state.demoRecipes);
    state.editingRecipeId = null;
    editingRecipeBaseline = "";
    state.addSubmitting = false;
    state.recipeActionNotice = duplicate
      ? `“${savedRecipe.title}” is already in this practice recipe book.`
      : editingRecipeId
      ? `“${savedRecipe.title}” was updated in this tab.`
      : `“${savedRecipe.title}” was added to this tab-only practice recipe book.`;
    openRecipe(savedRecipe.id);
    return;
  }

  const expectedOwnerId = state.authorizedOwnerId;
  const editingRecipeId = state.editingRecipeId;
  const mutationRevision = ++recipeMutationRevision;
  const isCurrentMutation = () => mutationRevision === recipeMutationRevision
    && state.authorizedOwnerId === expectedOwnerId
    && String(window.KiddoSproutSession?.getSession?.()?.user?.id || "").trim().toLowerCase() === expectedOwnerId;
  recipeLoadRevision += 1;
  state.cloudChecking = false;
  state.addSubmitting = true;
  state.addError = "";
  state.recipeActionNotice = "";
  render();
  try {
    const result = await withRecipeMutationLock(expectedOwnerId, async () => {
      if (!await recheckRecipeMutationRule(expectedOwnerId) || !isCurrentMutation()) return null;
      const access = await validatedRecipeAccess(expectedOwnerId);
      if (!isCurrentMutation()) return null;
      state.session = access.session;

      // Read inside the cross-tab mutation lock. This catches a stale edit and
      // turns two identical simultaneous submissions into one cloud recipe.
      const latestCloudRecipes = await fetchAllRecipes(access.accessToken, access.ownerId);
      if (!isCurrentMutation()) return null;
      if (editingRecipeId) {
        const latestRecipe = latestCloudRecipes.find((recipe) => recipe.id === editingRecipeId);
        if (!latestRecipe) {
          throw recipeOperationError("not_found", "That family recipe was removed in another tab.");
        }
        if (editingRecipeBaseline && recipeContentFingerprint(latestRecipe) !== editingRecipeBaseline) {
          throw recipeOperationError("conflict", "That family recipe changed in another tab.");
        }
        const savedRecipe = await updateRecipe(access.accessToken, access.ownerId, editingRecipeId, recipeInput);
        return {
          savedRecipe,
          duplicate: false,
          cloudRecipes: latestCloudRecipes.map((recipe) => recipe.id === savedRecipe.id ? savedRecipe : recipe)
        };
      }

      const fingerprint = recipeContentFingerprint(recipeInput);
      const duplicateRecipe = latestCloudRecipes.find((recipe) => recipeContentFingerprint(recipe) === fingerprint);
      if (duplicateRecipe) {
        return { savedRecipe: duplicateRecipe, duplicate: true, cloudRecipes: latestCloudRecipes };
      }
      if (latestCloudRecipes.length >= RECIPE_CLOUD_MAX_ROWS) {
        throw recipeOperationError("validation", `This family recipe book is full (${RECIPE_CLOUD_MAX_ROWS} recipes). Remove one before adding another.`);
      }
      const savedRecipe = await insertRecipe(access.accessToken, access.ownerId, recipeInput);
      return { savedRecipe, duplicate: false, cloudRecipes: latestCloudRecipes.concat(savedRecipe) };
    });
    if (!result || !isCurrentMutation()) return;
    const { savedRecipe } = result;
    state.cloudRecipes = result.cloudRecipes;
    state.recipes = mergeFamilyRecipes(state.cloudRecipes);
    state.editingRecipeId = null;
    editingRecipeBaseline = "";
    state.addSubmitting = false;
    state.recipeActionNotice = result.duplicate
      ? `“${savedRecipe.title}” was already in this family account, so another copy was not added.`
      : editingRecipeId
      ? `“${savedRecipe.title}” was updated.`
      : `“${savedRecipe.title}” was saved to this family account.`;
    if (!result.duplicate) announceRecipeCloudChange(expectedOwnerId);
    openRecipe(savedRecipe.id);
  } catch (err) {
    if (!isCurrentMutation()) return;
    state.addForm = draft;
    state.addError = friendlyRecipeMutationError(err);
    state.addSubmitting = false;
    render();
    focusAfterRender("#recipe-editor-error");
  } finally {
    flushExternalRecipeRefresh();
  }
}

function finishRecipeDeleteDialogClose() {
  const dialog = document.getElementById("recipe-delete-dialog");
  if (!dialog) return;
  dialog.removeAttribute("aria-busy");
  dialog.removeAttribute("data-recipe-id");
  const returnTarget = recipeDeleteReturnFocus?.isConnected
    ? recipeDeleteReturnFocus
    : (recipeDeleteReturnFocusId ? document.getElementById(recipeDeleteReturnFocusId) : null)
      || document.querySelector(".detail-title")
      || document.getElementById("recipe-results-summary");
  if (returnTarget && typeof returnTarget.focus === "function") returnTarget.focus();
  recipeDeleteReturnFocus = null;
  recipeDeleteReturnFocusId = "";
  flushExternalRecipeRefresh();
}

function closeRecipeDeleteDialog() {
  const dialog = document.getElementById("recipe-delete-dialog");
  if (!dialog) return;
  if (typeof dialog.close === "function" && dialog.open) {
    dialog.close();
    return;
  }
  const wasOpen = dialog.hasAttribute("open");
  dialog.removeAttribute("open");
  // Browsers without HTMLDialogElement.close() do not dispatch a close event.
  // Keep the compatibility path equivalent: restore focus and release any
  // cross-tab refresh that was queued while the confirmation was visible.
  if (wasOpen) finishRecipeDeleteDialogClose();
}

function requestSelectedRecipeRemoval() {
  const recipe = getSelectedRecipe();
  if (!isEditableRecipe(recipe) || state.detailSubmitting) return;
  const dialog = document.getElementById("recipe-delete-dialog");
  const recipeName = document.getElementById("recipe-delete-name");
  const dialogError = document.getElementById("recipe-delete-error");
  const confirmButton = document.getElementById("recipe-delete-confirm");
  const cancelButton = document.getElementById("recipe-delete-cancel");
  if (!dialog || !recipeName || !dialogError || !confirmButton || !cancelButton) return;
  if (dialog.open) return;

  recipeDeleteReturnFocus = document.activeElement;
  recipeDeleteReturnFocusId = String(recipeDeleteReturnFocus?.id || "");
  dialog.dataset.recipeId = recipe.id;
  recipeName.textContent = `“${recipe.title}”`;
  dialogError.textContent = "";
  dialogError.hidden = true;
  dialog.removeAttribute("aria-busy");
  confirmButton.disabled = false;
  confirmButton.textContent = "Remove recipe";
  cancelButton.disabled = false;
  if (typeof dialog.showModal === "function") dialog.showModal();
  else {
    dialog.setAttribute("open", "");
    cancelButton.focus();
  }
}

async function removeSelectedRecipe() {
  const recipe = getSelectedRecipe();
  const dialog = document.getElementById("recipe-delete-dialog");
  const dialogError = document.getElementById("recipe-delete-error");
  const confirmButton = document.getElementById("recipe-delete-confirm");
  const cancelButton = document.getElementById("recipe-delete-cancel");
  if (!isEditableRecipe(recipe) || state.detailSubmitting || dialog?.dataset.recipeId !== recipe.id) return;

  if (canWriteDemoRecipes() && recipe?._source === "demo") {
    state.detailSubmitting = true;
    state.detailError = "";
    const nextRecipes = state.demoRecipes.filter((item) => item.id !== recipe.id);
    if (!writeDemoRecipes(nextRecipes)) {
      state.detailSubmitting = false;
      state.detailError = "This browser could not update the practice recipe book. Check private-browsing or storage settings and try again.";
      render();
      if (dialogError) {
        dialogError.textContent = state.detailError;
        dialogError.hidden = false;
      }
      dialogError?.focus();
      return;
    }
    state.demoRecipes = nextRecipes;
    state.recipes = mergeDemoRecipes(state.demoRecipes);
    state.detailSubmitting = false;
    state.recipeActionNotice = `“${recipe.title}” was removed from this tab-only practice recipe book.`;
    closeRecipeDeleteDialog();
    backToBrowse({ focusSummary: true });
    return;
  }

  const expectedOwnerId = state.authorizedOwnerId;
  const recipeId = recipe.id;
  const mutationRevision = ++recipeMutationRevision;
  const isCurrentMutation = () => mutationRevision === recipeMutationRevision
    && state.authorizedOwnerId === expectedOwnerId
    && String(window.KiddoSproutSession?.getSession?.()?.user?.id || "").trim().toLowerCase() === expectedOwnerId
    && state.selectedRecipeId === recipeId;
  recipeLoadRevision += 1;
  state.cloudChecking = false;
  state.detailSubmitting = true;
  state.detailError = "";
  state.recipeActionNotice = "";
  dialog?.setAttribute("aria-busy", "true");
  if (dialogError) {
    dialogError.textContent = "";
    dialogError.hidden = true;
  }
  if (confirmButton) {
    confirmButton.disabled = true;
    confirmButton.textContent = "Removing…";
  }
  if (cancelButton) cancelButton.disabled = true;
  render();
  try {
    const result = await withRecipeMutationLock(expectedOwnerId, async () => {
      if (!await recheckRecipeMutationRule(expectedOwnerId) || !isCurrentMutation()) return null;
      const access = await validatedRecipeAccess(expectedOwnerId);
      if (!isCurrentMutation()) return null;
      state.session = access.session;
      const latestCloudRecipes = await fetchAllRecipes(access.accessToken, access.ownerId);
      if (!isCurrentMutation()) return null;
      if (!latestCloudRecipes.some((item) => item.id === recipeId)) {
        return { alreadyRemoved: true, cloudRecipes: latestCloudRecipes };
      }
      await deleteRecipe(access.accessToken, access.ownerId, recipeId);
      return {
        alreadyRemoved: false,
        cloudRecipes: latestCloudRecipes.filter((item) => item.id !== recipeId)
      };
    });
    if (!result || !isCurrentMutation()) {
      closeRecipeDeleteDialog();
      return;
    }
    state.cloudRecipes = result.cloudRecipes;
    state.recipes = mergeFamilyRecipes(state.cloudRecipes);
    state.detailSubmitting = false;
    state.recipeActionNotice = result.alreadyRemoved
      ? `“${recipe.title}” had already been removed in another tab.`
      : `“${recipe.title}” was removed from this family account.`;
    if (!result.alreadyRemoved) announceRecipeCloudChange(expectedOwnerId);
    closeRecipeDeleteDialog();
    backToBrowse({ focusSummary: true });
  } catch (error) {
    if (!isCurrentMutation()) {
      closeRecipeDeleteDialog();
      return;
    }
    state.detailSubmitting = false;
    state.detailError = friendlyRecipeMutationError(error).replace("saved", "removed");
    render();
    dialog?.removeAttribute("aria-busy");
    if (dialogError) {
      dialogError.textContent = state.detailError;
      dialogError.hidden = false;
    }
    if (confirmButton) {
      confirmButton.disabled = false;
      confirmButton.textContent = "Try again";
    }
    if (cancelButton) cancelButton.disabled = false;
    dialogError?.focus();
  } finally {
    flushExternalRecipeRefresh();
  }
}

// ---- Render ----
function render() {
  const app = document.getElementById("app");
  cancelExactPhotoHydration();
  document.body.classList.toggle("auth-page", !state.authChecked || state.recoveryMode || (!state.session && !state.readOnlyBrowse));

  if (kiddoSproutGate) {
    disposeAuthHumanCheck();
    showKiddoSproutGate(kiddoSproutGate.title, kiddoSproutGate.message, {
      retry: kiddoSproutGate.retry === true
    });
    return;
  }

  if (recipeAccessChecking) {
    disposeAuthHumanCheck();
    app.innerHTML = `<div class="loading-screen" role="status" aria-live="polite">Checking parent access…</div>`;
    return;
  }

  if (!state.authChecked) {
    disposeAuthHumanCheck();
    app.innerHTML = `<div class="loading-screen" role="status" aria-live="polite">Loading…</div>`;
    return;
  }
  if (state.recoveryMode) {
    disposeAuthHumanCheck();
    renderPasswordResetScreen(app);
    return;
  }
  if (!state.session && !state.readOnlyBrowse) { renderAuthScreen(app); return; }
  disposeAuthHumanCheck();
  if (!state.recipesLoaded) { app.innerHTML = `<div class="loading-screen" role="status" aria-live="polite">Loading recipes…</div>`; return; }

  if (state.screen === "detail") renderDetailScreen(app);
  else if (state.screen === "add") renderAddScreen(app);
  else renderBrowseScreen(app);
}

function currentRecipeStatus() {
  if (state.recipeMode === "demo") {
    return { title: "Interactive practice recipe book", message: state.recipeNotice, retry: false };
  }
  if (state.recipeMode === "cloud") {
    return { title: "Cloud recipes loaded", message: state.recipeNotice, retry: false };
  }
  if (state.recipeMode === "stale") {
    return { title: "Previously synced recipes", message: state.recipeNotice, retry: true };
  }
  return {
    title: "Built-in recipes only",
    message: state.recipeNotice || "Cloud recipes are unavailable, so viewing is read-only and nothing will be saved.",
    retry: Boolean(state.session && SUPABASE_CONNECTED)
  };
}

function visibleRecipeCategoryEntries(categories) {
  const indexedCategories = categories.map((category, index) => ({ category, index }));
  let visibleCategories = indexedCategories.slice();
  if (!showAllRecipeCategories && categories.length > RECIPE_CATEGORY_INITIAL_LIMIT) {
    visibleCategories = indexedCategories.slice(0, RECIPE_CATEGORY_INITIAL_LIMIT);
    const selectedIndex = categories.indexOf(state.selectedCategory);
    if (selectedIndex >= RECIPE_CATEGORY_INITIAL_LIMIT) {
      visibleCategories.push(indexedCategories[selectedIndex]);
    }
  }
  return visibleCategories;
}

function recipeCategoryChipsHtml(categories) {
  return visibleRecipeCategoryEntries(categories).map(({ category, index }) => `
    <button type="button" class="category-chip ${category === state.selectedCategory ? "active" : ""}"

      tabindex="${category === state.selectedCategory ? "0" : "-1"}">${esc(category)}</button>

  const hiddenCount = categories.length - visibleRecipeCategoryEntries(categories).length;

    aria-controls="recipe-category-options" aria-label="Show ${hiddenCount} more recipe categories">More categories (${hiddenCount})</button>`;

function refreshRecipeList(options = {}) {
  // Only re-render the list + chips (not the search input) so focus/keyboard stays intact
  const categories = getCategories();
  reconcileSelectedRecipeCategory(categories);
  const filtered = getFilteredRecipes();
  const page = getRecipePage(filtered);

  const chipWrap = document.querySelector(".category-scroll");
  if (chipWrap) {
    chipWrap.innerHTML = recipeCategoryChipsHtml(categories);
  }

  const categoryMore = document.getElementById("recipe-category-more");
  if (categoryMore) categoryMore.innerHTML = recipeCategoryMoreButtonHtml(categories);

  const summary = document.getElementById("recipe-results-summary");
  if (summary) summary.textContent = recipeResultsSummary(page);

  const clearSearchButton = document.getElementById("clear-recipe-search");
  if (clearSearchButton) clearSearchButton.hidden = !state.searchQuery;

  const list = document.getElementById("recipe-list");
  if (list) {
    list.innerHTML = recipeCardsHtml(page.visible, canWriteRecipes());
  }

  const pagination = document.getElementById("recipe-pagination");
  if (pagination) pagination.innerHTML = recipePaginationHtml(page);

  wireRecipeCategories(categories);
  wireRecipeCards();
  wireRecipePagination();
  scheduleExactPhotoHydration(page.visible);

  if (Number.isInteger(options.focusCategoryIndex)) {
    const categoryTarget = document.querySelector(`[data-category-index="${options.focusCategoryIndex}"]`);
    categoryTarget?.focus();
    categoryTarget?.scrollIntoView({ block: "nearest", inline: "nearest" });
  } else if (Number.isInteger(options.focusRecipeIndex)) {
    (document.querySelectorAll(".recipe-card")[options.focusRecipeIndex] || summary)?.focus();
  }
}

function wireRecipeCategories(categories) {
  const categoryButtons = Array.from(document.querySelectorAll(".category-chip[data-category-index]"));
  const chooseCategory = (button) => {
    const categoryIndex = Number(button.getAttribute("data-category-index"));
    const category = categories[categoryIndex];
    if (typeof category !== "string") return;
    state.selectedCategory = category;
    clearRecipeActionNotice();
    resetRecipePage();
    refreshRecipeList({ focusCategoryIndex: categoryIndex });
  };
  categoryButtons.forEach((button, buttonIndex) => {
    button.addEventListener("click", () => {
      chooseCategory(button);
    });
    button.addEventListener("keydown", (event) => {
      const direction = {
        ArrowRight: 1,
        ArrowDown: 1,
        ArrowLeft: -1,
        ArrowUp: -1,
      }[event.key];
      let nextButtonIndex = direction == null ? -1 : (buttonIndex + direction + categoryButtons.length) % categoryButtons.length;
      if (event.key === "Home") nextButtonIndex = 0;
      if (event.key === "End") nextButtonIndex = categoryButtons.length - 1;
      if (nextButtonIndex < 0) return;
      event.preventDefault();
      chooseCategory(categoryButtons[nextButtonIndex]);
    });
  });
  document.getElementById("show-all-recipe-categories")?.addEventListener("click", () => {
    showAllRecipeCategories = true;
    persistRecipeBrowseState();
    refreshRecipeList({ focusCategoryIndex: RECIPE_CATEGORY_INITIAL_LIMIT });
  });
}

function wireRecipeCards() {
  document.querySelectorAll(".recipe-card").forEach((card) => {
    card.addEventListener("click", () => openRecipe(card.getAttribute("data-recipe-id")));
  });
  document.getElementById("reset-recipe-filters")?.addEventListener("click", resetRecipeFilters);
}

function wireRecipePagination() {
  const loadMoreButton = document.getElementById("load-more-recipes");
  if (!loadMoreButton) return;
  loadMoreButton.addEventListener("click", () => {
    const previousVisibleCount = getRecipePage(getFilteredRecipes()).visible.length;
    state.visibleRecipeLimit = normalizedRecipePageLimit(state.visibleRecipeLimit + RECIPE_PAGE_SIZE);
    persistRecipeBrowseState();
    refreshRecipeList({ focusRecipeIndex: previousVisibleCount });
  });
}

async function revalidateConnectedRecipeAccess() {
  if (PUBLIC_DEMO_ONLY || state.readOnlyBrowse || !state.authorizedOwnerId || document.hidden) return true;
  if (recipeAccessRefreshInFlight) return recipeAccessRefreshInFlight;
  const expectedOwnerId = state.authorizedOwnerId;
  recipeAccessChecking = true;
  closeRecipeDeleteDialog();
  render();
  recipeAccessRefreshInFlight = (async () => {
    const allowed = await canOpenKiddoSproutApp("recipe", APP_NAME, expectedOwnerId);
    if (allowed) {
      recipeAccessChecking = false;
      render();
      return true;
    }

    // A parent may have blocked FlavorNest, changed the active family, or
    // signed into another account while this tab was away. Invalidate pending
    // work and discard family-only data before leaving the access gate visible.
    recipeLoadRevision += 1;
    recipeMutationRevision += 1;
    state.authorizedOwnerId = "";
    state.cloudRecipes = [];
    state.recipes = [];
    state.recipesLoaded = false;
    state.selectedRecipeId = null;
    state.editingRecipeId = null;
    state.detailSubmitting = false;
    state.addSubmitting = false;
    recipeAccessChecking = false;
    render();
    return false;
  })().finally(() => {
    recipeAccessRefreshInFlight = null;
  });
  return recipeAccessRefreshInFlight;
}

async function refreshRecipesWhenPageReturns() {
  const allowed = await revalidateConnectedRecipeAccess();
  if (allowed) scheduleExternalRecipeRefresh();
}

window.addEventListener("storage", handleRecipeSyncStorage);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") void refreshRecipesWhenPageReturns();
});
window.addEventListener("pageshow", () => { void refreshRecipesWhenPageReturns(); });

// ---- Boot ----
async function bootFlavorNest() {
  wireRecipeDeleteDialog();
  if (isKiddoSproutDemoMode()) {
    startReadOnlyRecipeBrowse();
    return;
  }
  // A raw static publish (for example, GitHub Pages from the repository
  // branch) does not include the ignored, environment-specific
  // supabase-config.js file. Keep the useful built-in recipe book available
  // without weakening the authenticated cloud path or pretending that saves
  // work when no account service has been configured.
  if (!SUPABASE_CONNECTED) {
    startUnconfiguredRecipeBrowse();
    return;
  }
  try {
    await restoreSession();
  } catch (error) {
    state.authChecked = true;
    state.authorizedOwnerId = "";
    showKiddoSproutGate(
      "FlavorNest could not start safely",
      "Return to KiddoSprout and try again so the current parent and child settings can be verified."
    );
  }
}
void bootFlavorNest();
</script>
