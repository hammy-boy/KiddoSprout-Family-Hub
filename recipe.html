<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#fff8ec" />
<script>
  (function () {
    "use strict";
    function readState(storage, key) {
      try {
        const value = JSON.parse(storage?.getItem(key) || "null");
        return value && typeof value === "object" && !Array.isArray(value) ? value : null;
      } catch (error) {
        return null;
      }
    }

    function applySavedTheme() {
      let demoState = null;
      let safePreferences = null;
      let demoActive = false;
      try {
        demoState = readState(window.sessionStorage, "kiddosprout.demo.v1.family");
        demoActive = Boolean(demoState)
          || window.sessionStorage.getItem("kiddosprout.demo.v1.active") === "1";
      } catch (error) {
        // Restricted storage falls back to the operating-system preference.
      }
      try {
        safePreferences = readState(window.localStorage, "kiddosproutPreferences");
      } catch (error) {
        // Restricted storage falls back to the operating-system preference.
      }
      const state = demoActive ? demoState : safePreferences;
      const choice = ["auto", "day", "night"].includes(state?.themeMode) ? state.themeMode : "auto";
      const hour = new Date().getHours();
      const resolved = choice === "auto" ? (hour >= 19 || hour < 7 ? "night" : "day") : choice;
      document.documentElement.classList.toggle("theme-night", resolved === "night");
      document.documentElement.classList.toggle("theme-day", resolved === "day");
      document.documentElement.dataset.themeMode = choice;
      document.querySelector('meta[name="theme-color"]')?.setAttribute(
        "content",
        resolved === "night" ? "#13001f" : "#fff8ec"
      );
    }

    applySavedTheme();
    if (typeof window.setInterval === "function") {
      window.setInterval(() => {
        if (document.documentElement.dataset.themeMode === "auto") applySavedTheme();
      }, 60000);
    }
    window.addEventListener?.("pageshow", applySavedTheme);
    document.addEventListener?.("visibilitychange", () => {
      if (document.visibilityState === "visible") applySavedTheme();
    });
    window.addEventListener("storage", (event) => {
      if (event.key === "kiddosproutPreferences") applySavedTheme();
    });
  }());
</script>

<script>
// ---- Config ----
const SUPABASE_CONFIG = window.KIDDO_SPROUT_SUPABASE || {};
const APP_NAME = "FlavorNest";
const DEFAULT_SUPABASE_URL = "";
const DEFAULT_SUPABASE_PUBLISHABLE_KEY = "";
const PUBLIC_DEMO_ONLY = SUPABASE_CONFIG.publicDemoOnly === true;
function cleanSupabaseUrl(value) {
  const url = String(value || "").trim().replace(/\/rest\/v1\/?$/i, "").replace(/\/+$/, "");
  const isManagedUrl = /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url);
  const isLocalUrl = /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/i.test(url);
  if (!isManagedUrl && !isLocalUrl) return "";
  if (url.includes("your_supabase")) return "";
  return url;
}
function cleanSupabaseKey(value) {
  const key = String(value || "").trim();
  if (!key || key.includes("your_supabase")) return "";
  return window.KiddoSproutRecipeCloud?.isBrowserSafePublishableKey?.(key) === true ? key : "";
}
const SUPABASE_URL = cleanSupabaseUrl(SUPABASE_CONFIG.url) || DEFAULT_SUPABASE_URL;
const SUPABASE_PUBLISHABLE_KEY = cleanSupabaseKey(SUPABASE_CONFIG.publishableKey || SUPABASE_CONFIG.anonKey) || DEFAULT_SUPABASE_PUBLISHABLE_KEY;
const SUPABASE_CONNECTED = Boolean(!PUBLIC_DEMO_ONLY && SUPABASE_URL && SUPABASE_PUBLISHABLE_KEY);
const AUTH_EMAIL_DELIVERY_READY = Boolean(!PUBLIC_DEMO_ONLY && SUPABASE_CONFIG.emailDeliveryReady === true);
const EMAIL_DELIVERY_UNAVAILABLE_MESSAGE = "Email sign-up and password recovery are not available on this KiddoSprout setup yet.";
const KIDDO_CHILD_SITE_URL = "index.html#child";
const KIDDO_DEMO_ACTIVE_KEY = "kiddosprout.demo.v1.active";
const RECIPE_PAGE_SIZE = 30;
const RECIPE_CATEGORY_INITIAL_LIMIT = 24;
const RECIPE_CLOUD_MAX_ROWS = 500;
const RECIPE_BROWSE_STATE_KEY = "flavornest.browse.v1";
const RECIPE_SYNC_SIGNAL_KEY = "flavornest.recipes.changed.v1";
const RECIPE_DEMO_STORAGE_KEY = "kiddosprout.demo.v1.flavornest-recipes";
const RECIPE_DEMO_MAX_ROWS = 25;
const AUTH_REQUEST_TIMEOUT_MS = 15000;
const RECIPE_PASSWORD_RECOVERY_TRANSACTION_KEY = "flavornest.password-recovery.v1";
const RECIPE_PASSWORD_RECOVERY_TRANSACTION_PARAM = "fn_recovery";
const RECIPE_PASSWORD_RECOVERY_TRANSACTION_TTL_MS = 60 * 60 * 1000;
const AUTH_REQUEST_GENERIC_SIGNUP_MESSAGE = "If this email can be used for FlavorNest, a confirmation link will arrive. Check the inbox and spam folder before logging in.";
const AUTH_REQUEST_GENERIC_RECOVERY_MESSAGE = "If a KiddoSprout account matches that email, a password reset link will arrive. Check the inbox and spam folder.";
let kiddoSproutGate = null;

function isKiddoSproutDemoMode() {
  if (PUBLIC_DEMO_ONLY) return true;
  try {
    return window.sessionStorage.getItem(KIDDO_DEMO_ACTIVE_KEY) === "1";
  } catch (error) {
    return false;
  }
}

let recipeCloudClient = null;
function getRecipeCloudClient() {
  if (PUBLIC_DEMO_ONLY || !SUPABASE_CONNECTED) {
    throw new Error("Family recipe storage is unavailable on this setup.");
  }
  if (!window.KiddoSproutRecipeCloud) {
    throw new Error("Family recipe storage could not start in this browser.");
  }
  if (!recipeCloudClient) {
    recipeCloudClient = window.KiddoSproutRecipeCloud.createClient({
      baseUrl: SUPABASE_URL,
      publishableKey: SUPABASE_PUBLISHABLE_KEY
    });
  }
  return recipeCloudClient;
}

function returnToKiddoSproutChild() {
  window.location.href = KIDDO_CHILD_SITE_URL;
}

function escapeKiddoSproutText(value) {
  return String(value || "").replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    "\"": "&quot;",
    "'": "&#039;"
  }[char]));
}

function showKiddoSproutGate(title, message, { retry = false } = {}) {
  kiddoSproutGate = {
    title: String(title || "KiddoSprout access needed").slice(0, 160),
    message: String(message || "Return to KiddoSprout and try again.").slice(0, 500),
    retry: retry === true
  };
  document.body.classList.add("auth-page");
  document.getElementById("app").innerHTML = `
    <div class="auth-wrap">
      <div class="logo-row">
        <span class="logo-icon">FN</span>
        <span class="eyebrow">KiddoSprout Access</span>
      </div>
      <h1>${escapeKiddoSproutText(kiddoSproutGate.title)}</h1>
      <p class="info-text">${escapeKiddoSproutText(kiddoSproutGate.message)}</p>
      ${kiddoSproutGate.retry ? `<button class="btn-primary" id="kiddo-gate-retry" type="button">Try again</button>` : ""}
      <a class="btn-primary" href="${KIDDO_CHILD_SITE_URL}" style="display:flex;align-items:center;justify-content:center;text-decoration:none;${kiddoSproutGate.retry ? "margin-top:10px;" : ""}">Back to KiddoSprout</a>
    </div>
  `;
  document.getElementById("kiddo-gate-retry")?.addEventListener("click", () => {
    void retryKiddoSproutGate();
  });
}

function recipeSessionError(kind, message, cause) {
  const error = new Error(message);
  error.kind = kind;
  if (cause) error.cause = cause;
  return error;
}

function sharedRecipeSession() {
  const sessionApi = window.KiddoSproutSession;
  if (!sessionApi || typeof sessionApi.validate !== "function"
      || typeof sessionApi.getAccessToken !== "function"
      || typeof sessionApi.getSession !== "function") {
    throw recipeSessionError("auth", "A verified KiddoSprout parent login is required.");
  }
  return sessionApi;
}

function recipeSessionFailure(error) {
  const sessionApi = window.KiddoSproutSession;
  if (sessionApi?.isTemporaryError?.(error) || error?.kind === "session_refresh_unavailable") {
    return recipeSessionError(
      "session_refresh_unavailable",
      "The account service cannot be reached right now. Your saved sign-in and recipe draft are safe.",
      error
    );
  }
  return error?.kind
    ? error
    : recipeSessionError("auth", "A verified KiddoSprout parent login is required.", error);
}

async function freshSharedRecipeToken(expectedOwnerId) {
  const sessionApi = sharedRecipeSession();
  let accessToken;
  try {
    accessToken = await sessionApi.getAccessToken();
  } catch (error) {
    throw recipeSessionFailure(error);
  }
  const current = sessionApi.getSession();
  const currentOwner = String(current?.user?.id || "").trim().toLowerCase();
  const expectedOwner = String(expectedOwnerId || "").trim().toLowerCase();
  if (!accessToken || !currentOwner || (expectedOwner && currentOwner !== expectedOwner)
      || String(current?.access_token || "") !== String(accessToken)) {
    throw recipeSessionError("auth", "The KiddoSprout parent session changed. Log in again before continuing.");
  }
  return String(accessToken);
}

async function validatedRecipeAccess(expectedOwnerId = "") {
  const sessionApi = sharedRecipeSession();
  let validated;
  try {
    validated = await sessionApi.validate();
  } catch (error) {
    throw recipeSessionFailure(error);
  }
  const ownerId = String(validated?.user?.id || "").trim().toLowerCase();
  const expectedOwner = String(expectedOwnerId || "").trim().toLowerCase();
  if (!ownerId || (expectedOwner && ownerId !== expectedOwner)) {
    throw recipeSessionError("auth", "A verified KiddoSprout parent login is required.");
  }
  const accessToken = await freshSharedRecipeToken(ownerId);
  const current = sessionApi.getSession();
  if (!current || String(current.user?.id || "").trim().toLowerCase() !== ownerId) {
    throw recipeSessionError("auth", "The KiddoSprout parent session changed. Log in again before continuing.");
  }
  return {
    ownerId,
    accessToken,
    session: { ...current, access_token: accessToken, user: validated.user }
  };
}

function ownerBoundFamilyCloud(ownerId) {
  if (!window.KiddoSproutFamilyState?.createClient) {
    throw recipeSessionError("configuration", "Private KiddoSprout family storage is unavailable.");
  }
  const expectedOwner = String(ownerId || "").trim().toLowerCase();
  const shared = sharedRecipeSession();
  const sessionApi = Object.freeze({
    validate: async () => (await validatedRecipeAccess(expectedOwner)).session,
    getAccessToken: async () => freshSharedRecipeToken(expectedOwner),
    isTemporaryError: (error) => Boolean(
      shared.isTemporaryError?.(error) || error?.kind === "session_refresh_unavailable"
    )
  });
  return window.KiddoSproutFamilyState.createClient({
    baseUrl: SUPABASE_URL,
    publishableKey: SUPABASE_PUBLISHABLE_KEY,
    sessionApi
  });
}

function normalizeKiddoSproutRequest(request) {
  if (!Array.isArray(request)) return null;
  const title = String(request[0] || "").trim().slice(0, 100);
  if (!title || /^(?:no request|no request yet)$/i.test(title)) return null;
  return [
    title,
    String(request[1] || "Request from FlavorNest").trim().slice(0, 240),
    String(request[2] || title.charAt(0)).trim().slice(0, 3),
    String(request[3] || "appAccess").trim().slice(0, 40),
    ...request.slice(4, 8).map((value) => String(value || "").trim().slice(0, 100))
  ];
}

function getKiddoSproutActiveChild(family) {
  if (!family || typeof family !== "object" || Array.isArray(family)) return null;
  const activeChild = String(family.activeChild || "").trim();
  const children = family.children;
  if (!activeChild || !children || typeof children !== "object" || Array.isArray(children)) return null;
  if (!Object.prototype.hasOwnProperty.call(children, activeChild)) return null;
  const child = children[activeChild];
  return child && typeof child === "object" && !Array.isArray(child) ? child : null;
}

function queueKiddoSproutRequest(family, appId, appTitle) {
  const child = getKiddoSproutActiveChild(family);
  if (!child) return "unavailable";
  const request = normalizeKiddoSproutRequest([
    appTitle,
    `${appTitle} requested from a connected app page`,
    appTitle.charAt(0),
    "appAccess",
    appId
  ]);
  if (!request) return "unavailable";

  const requests = Array.isArray(child.requests)
    ? child.requests.map(normalizeKiddoSproutRequest).filter(Boolean).slice(0, 100)
    : [];
  const legacyRequest = normalizeKiddoSproutRequest(child.currentRequest);
  if (legacyRequest && Number(child.pending || 0) > requests.length
      && !requests.some((queued) => JSON.stringify(queued) === JSON.stringify(legacyRequest))) {
    requests.push(legacyRequest);
  }
  const requestKey = JSON.stringify(request);
  if (requests.some((queued) => JSON.stringify(queued) === requestKey)) return "duplicate";
  if (requests.length >= 100) return "full";

  requests.push(request);
  child.requests = requests;
  child.pending = requests.length;
  child.currentRequest = [...requests[0]];
  return "sent";
}

async function requestKiddoSproutAccess(appId, appTitle, family, familyCloud) {
  const result = queueKiddoSproutRequest(family, appId, appTitle);
  if (result !== "sent") return result;
  try {
    await familyCloud.save(family);
    return "sent";
  } catch (error) {
    return "unavailable";
  }
}

function kiddoSproutRequestMessage(result) {
  if (result === "sent") return "A request was sent to the parent dashboard for approval.";
  if (result === "duplicate") return "That request is already waiting on the parent dashboard.";
  if (result === "full") return "The parent request list is full. Ask a parent to review it first.";
  return "The parent dashboard could not save this request. Return to KiddoSprout and try again.";
}

async function canOpenKiddoSproutApp(appId, appTitle, expectedOwnerId = "") {
  try {
    if (!SUPABASE_CONNECTED) {
      showKiddoSproutGate("Parent account unavailable", "This KiddoSprout setup is not connected to its account service.");
      return false;
    }
    const initialAccess = await validatedRecipeAccess(expectedOwnerId);
    const familyCloud = ownerBoundFamilyCloud(initialAccess.ownerId);
    const family = await familyCloud.load();
    const currentAccess = await validatedRecipeAccess(initialAccess.ownerId);
    if (!family || typeof family !== "object" || Array.isArray(family) || family.parentAccountCreated !== true) {
      showKiddoSproutGate("Parent account needed", "Create or log in to the parent account before opening connected child apps.");
      return false;
    }
    const child = getKiddoSproutActiveChild(family);
    if (!child) {
      showKiddoSproutGate("Child profile needed", "Choose a valid child profile in KiddoSprout before opening connected child apps.");
      return false;
    }
    const appRules = child.appRules && typeof child.appRules === "object" && !Array.isArray(child.appRules)
      ? child.appRules
      : null;
    const rule = appRules && Object.prototype.hasOwnProperty.call(appRules, appId)
      ? appRules[appId]
      : (appId === "recipe" ? "allowed" : "request");
    if (rule === "allowed") {
      kiddoSproutGate = null;
      state.authorizedOwnerId = currentAccess.ownerId;
      state.session = currentAccess.session;
      return true;
    }
    if (rule === "blocked") {
      showKiddoSproutGate(appTitle + " is blocked", "A parent has blocked this app for the current child profile.");
      return false;
    }
    const requestResult = await requestKiddoSproutAccess(appId, appTitle, family, familyCloud);
    showKiddoSproutGate("Ask a parent first", kiddoSproutRequestMessage(requestResult));
    return false;
  } catch (err) {
    state.authorizedOwnerId = "";
    const temporary = window.KiddoSproutSession?.isTemporaryError?.(err)
      || window.KiddoSproutFamilyState?.isTemporaryError?.(err)
      || err?.kind === "session_refresh_unavailable";
    showKiddoSproutGate(
      temporary ? "Parent check temporarily unavailable" : "KiddoSprout check failed",
      temporary
        ? "KiddoSprout could not safely verify the parent account. Your sign-in is safe; try again when the connection returns."
        : "Open KiddoSprout again so this app can verify the parent account and child settings.",
      { retry: temporary }
    );
    return false;
  }
}

function setYouTubePanel(open) {
  youtubeMusicOpen = open;
  const panel = document.getElementById("youtube-music-panel");
  const button = document.getElementById("music-btn");
  if (panel) {
    panel.classList.toggle("open", open);
    panel.hidden = !open;
  }
  if (button) {
    button.classList.toggle("active", open || youtubeMusicPlaying);
    button.setAttribute("aria-expanded", String(open));
  }
}

function playYouTubeLink() {
  const select = document.getElementById("youtube-link-input");
  const error = document.getElementById("youtube-music-error");
  const wrap = document.getElementById("youtube-player-wrap");
  const label = document.getElementById("focus-sound-label");
  const sound = String(select && select.value || "rain");
  if (error) error.textContent = "";
  stopYouTubeMusic(false);
  try {
    focusAudio = createFocusSound(sound);
    if (label) label.textContent = focusAudio.label;
    if (wrap) wrap.classList.add("active");
    youtubeMusicVideoId = sound;
    youtubeMusicPlaying = true;
    setYouTubePanel(true);
    refreshYouTubeApiUi();
  } catch (err) {
    if (error) error.textContent = err.message || "Could not play music.";
  }
}

function stopYouTubeMusic(showClosed = true) {
  const wrap = document.getElementById("youtube-player-wrap");
  if (focusAudio) {
    focusAudio.stop();
    focusAudio = null;
  }
  if (wrap) wrap.classList.remove("active");
  youtubeMusicVideoId = "";
  youtubeMusicPlaying = false;
  if (showClosed) setYouTubePanel(youtubeMusicOpen);
}

async function searchYouTubeMusic() {
  playYouTubeLink();
}

function createFocusSound(kind) {
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) {
    throw new Error("This browser cannot play built-in focus music.");
  }
  const ctx = new AudioContext();
  if (ctx.state === "suspended") {
    void ctx.resume().catch(() => {});
  }
  const master = ctx.createGain();
  const delay = ctx.createDelay(1.2);
  const delayGain = ctx.createGain();
  const filter = ctx.createBiquadFilter();
  master.gain.value = 0.0001;
  filter.type = "lowpass";
  filter.frequency.value = 7600;
  delay.delayTime.value = 0.28;
  delayGain.gain.value = 0.16;
  master.connect(filter);
  filter.connect(ctx.destination);
  master.connect(delay);
  delay.connect(delayGain);
  delayGain.connect(filter);
  master.gain.setTargetAtTime(0.13, ctx.currentTime + 0.02, 0.45);
  const nodes = [master, filter, delay, delayGain];
  const settings = {
    rain: {
      label: "Soft piano loop",
      tempo: 74,
      root: 57,
      wave: "sine",
      chords: [[0, 3, 7, 10], [5, 8, 12, 15], [3, 7, 10, 14], [7, 10, 14, 17]],
      melody: [12, null, 15, 14, 10, null, 7, 10, 12, 15, 17, null, 15, 12, 10, null],
      bass: [0, 5, 3, 7],
      percussion: false
    },
    waves: {
      label: "Ocean lofi groove",
      tempo: 82,
      root: 50,
      wave: "triangle",
      chords: [[0, 4, 7, 11], [-2, 2, 5, 9], [3, 7, 10, 14], [5, 9, 12, 16]],
      melody: [12, 11, null, 9, 7, null, 9, 11, 12, null, 16, 14, 11, 9, null, 7],
      bass: [0, -2, 3, 5],
      percussion: true
    },
    kitchen: {
      label: "Kitchen jazz loop",
      tempo: 96,
      root: 53,
      wave: "sine",
      chords: [[0, 4, 7, 10], [2, 5, 9, 12], [4, 7, 11, 14], [5, 9, 12, 16]],
      melody: [12, null, 14, 16, 17, 16, 14, null, 12, 9, 7, null, 9, 12, 14, null],
      bass: [0, 2, 4, 5],
      percussion: true
    },
    chimes: {
      label: "Dream chime song",
      tempo: 68,
      root: 60,
      wave: "triangle",
      chords: [[0, 5, 7, 12], [-3, 0, 4, 9], [-5, -1, 2, 7], [2, 5, 9, 14]],
      melody: [12, 19, null, 17, 14, null, 12, 9, 7, null, 12, 14, 17, null, 19, null],
      bass: [0, -3, -5, 2],
      percussion: false
    }
  }[kind] || null;
  const track = settings || {
    label: "Soft piano loop",
    tempo: 74,
    root: 57,
    wave: "sine",
    chords: [[0, 3, 7, 10], [5, 8, 12, 15], [3, 7, 10, 14], [7, 10, 14, 17]],
    melody: [12, null, 15, 14, 10, null, 7, 10, 12, 15, 17, null, 15, 12, 10, null],
    bass: [0, 5, 3, 7],
    percussion: false
  };

  function midiToFrequency(note) {
    return 440 * Math.pow(2, (note - 69) / 12);
  }

  function playNote(note, when, length, volume, type = track.wave) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = midiToFrequency(note);
    gain.gain.setValueAtTime(0.0001, when);
    gain.gain.exponentialRampToValueAtTime(volume, when + 0.025);
    gain.gain.setTargetAtTime(0.0001, when + length, 0.16);
    osc.connect(gain);
    gain.connect(master);
    osc.addEventListener("ended", () => {
      try { osc.disconnect(); } catch (_) {}
      try { gain.disconnect(); } catch (_) {}
    }, { once: true });
    osc.start(when);
    osc.stop(when + length + 0.5);
  }

  function playSoftPercussion(when) {
    const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.08, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let index = 0; index < data.length; index += 1) {
      data[index] = (Math.random() * 2 - 1) * Math.pow(1 - index / data.length, 3);
    }
    const source = ctx.createBufferSource();
    const gain = ctx.createGain();
    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = "highpass";
    noiseFilter.frequency.value = 2600;
    gain.gain.value = 0.028;
    source.buffer = buffer;
    source.connect(noiseFilter);
    noiseFilter.connect(gain);
    gain.connect(master);
    source.addEventListener("ended", () => {
      try { source.disconnect(); } catch (_) {}
      try { noiseFilter.disconnect(); } catch (_) {}
      try { gain.disconnect(); } catch (_) {}
    }, { once: true });
    source.start(when);
  }

  const stepTime = 60 / track.tempo / 2;
  let step = 0;
  let nextTime = ctx.currentTime + 0.08;

  function scheduleMusic() {
    while (nextTime < ctx.currentTime + 1.1) {
      const barStep = step % 16;
      const chordIndex = Math.floor((step % 64) / 16);
      const chord = track.chords[chordIndex % track.chords.length];

      if (barStep === 0) {
        playNote(track.root + track.bass[chordIndex % track.bass.length] - 12, nextTime, stepTime * 7.5, 0.14, "sine");
      }

      if (barStep % 4 === 0) {
        chord.forEach((offset, index) => {
          playNote(track.root + offset, nextTime + index * 0.035, stepTime * 6.2, 0.055, index % 2 ? "triangle" : track.wave);
        });
      }

      if (barStep % 2 === 0) {
        const melodyNote = track.melody[barStep];
        if (melodyNote !== null && melodyNote !== undefined) {
          playNote(track.root + melodyNote, nextTime, stepTime * 1.55, 0.08, track.wave);
        }
      }

      if (track.percussion && (barStep === 4 || barStep === 12)) {
        playSoftPercussion(nextTime);
      }

      step += 1;
      nextTime += stepTime;
    }
  }

  scheduleMusic();
  const timer = window.setInterval(scheduleMusic, 180);

  return {
    label: track.label,
    stop() {
      window.clearInterval(timer);
      master.gain.setTargetAtTime(0, ctx.currentTime, 0.08);
      window.setTimeout(() => {
        nodes.forEach((node) => {
          try { if (typeof node.stop === "function") node.stop(); } catch (_) {}
          try { if (typeof node.disconnect === "function") node.disconnect(); } catch (_) {}
        });
        try { ctx.close(); } catch (_) {}
      }, 220);
    }
  };
}

// Embedded recipe snapshot for standalone/offline use (463 recipes).
// The live Supabase collection replaces this snapshot whenever it is reachable.
const RECIPE_CATALOG = window.KiddoSproutRecipeCatalog;
if (!RECIPE_CATALOG
    || RECIPE_CATALOG.version !== 1
    || !Array.isArray(RECIPE_CATALOG.embedded)
    || !Array.isArray(RECIPE_CATALOG.custom)) {
  throw new Error("The built-in recipe catalogue could not be loaded safely.");
}
const EMBEDDED_RECIPES = RECIPE_CATALOG.embedded;
const CUSTOM_RECIPES = RECIPE_CATALOG.custom;

// Recipes added directly to this edition of the book.
function recipeIdentityText(value) {
  return String(value || "")
    .normalize("NFKC")
    .trim()
    .toLocaleLowerCase("en-GB")
    .replace(/\s+/g, " ");
}

function dedupeBuiltInRecipes(recipes) {
  const seenIds = new Set();
  const seenTitles = new Set();
  const unique = [];
  for (let index = recipes.length - 1; index >= 0; index -= 1) {
    const recipe = recipes[index];
    const id = recipeIdentityText(recipe?.id);
    const title = recipeIdentityText(recipe?.title);
    if (!id || !title || seenIds.has(id) || seenTitles.has(title)) continue;
    seenIds.add(id);
    seenTitles.add(title);
    unique.push(recipe);
  }
  return unique.reverse();
}

function mergeCustomRecipes(recipes) {
  const uniqueCustomRecipes = dedupeBuiltInRecipes(CUSTOM_RECIPES);
  const customTitles = new Set(uniqueCustomRecipes.map((recipe) => recipeIdentityText(recipe.title)));
  const customIds = new Set(uniqueCustomRecipes.map((recipe) => recipeIdentityText(recipe.id)));
  return dedupeBuiltInRecipes(Array.isArray(recipes) ? recipes : [])
    .filter((recipe) => !customTitles.has(recipeIdentityText(recipe.title)) && !customIds.has(recipeIdentityText(recipe.id)))
    .concat(uniqueCustomRecipes.map((recipe) => ({ ...recipe })))
    .sort((a, b) => a.title.localeCompare(b.title));
}

function builtInRecipeCollection() {
  return mergeCustomRecipes(EMBEDDED_RECIPES.map((recipe) => ({ ...recipe })))
    .map((recipe) => ({ ...recipe, _source: "built-in" }));
}

function mergeFamilyRecipes(cloudRecipes) {
  const familyRecipes = cloudRecipes.map((recipe) => ({ ...recipe, _source: "cloud" }));
  const familyTitles = new Set(familyRecipes.map((recipe) => recipeIdentityText(recipe.title)));
  const familyIds = new Set(familyRecipes.map((recipe) => recipeIdentityText(recipe.id)));
  return builtInRecipeCollection()
    .filter((recipe) => !familyTitles.has(recipeIdentityText(recipe.title)) && !familyIds.has(recipeIdentityText(recipe.id)))
    .concat(familyRecipes)
    .sort((a, b) => a.title.localeCompare(b.title));
}

function demoRecipeId() {
  if (typeof window.crypto?.randomUUID === "function") {
    return `demo-${window.crypto.randomUUID()}`;
  }
  const bytes = new Uint8Array(16);
  window.crypto?.getRandomValues?.(bytes);
  const suffix = Array.from(bytes, (value) => value.toString(16).padStart(2, "0")).join("");
  return `demo-${suffix || String(Date.now())}`;
}

function normalizeStoredDemoRecipe(recipe) {
  if (!recipe || typeof recipe !== "object" || !String(recipe.id || "").startsWith("demo-")) return null;
  try {
    const normalized = window.KiddoSproutRecipeCloud.normalizeRecipeInput({
      title: recipe.title,
      category: recipe.category,
      ingredients: recipe.ingredients,
      steps: recipe.steps,
    });
    return { id: String(recipe.id), ...normalized, _source: "demo" };
  } catch (error) {
    return null;
  }
}

function readDemoRecipes() {
  if (!isKiddoSproutDemoMode()) return [];
  try {
    const parsed = JSON.parse(window.sessionStorage.getItem(RECIPE_DEMO_STORAGE_KEY) || "[]");
    if (!Array.isArray(parsed)) return [];
    return parsed.slice(0, RECIPE_DEMO_MAX_ROWS).map(normalizeStoredDemoRecipe).filter(Boolean);
  } catch (error) {
    return [];
  }
}

function writeDemoRecipes(recipes) {
  if (!isKiddoSproutDemoMode()) return false;
  const safeRecipes = (Array.isArray(recipes) ? recipes : [])
    .slice(0, RECIPE_DEMO_MAX_ROWS)
    .map(normalizeStoredDemoRecipe)
    .filter(Boolean)
    .map(({ id, title, category, ingredients, steps }) => ({ id, title, category, ingredients, steps }));
  try {
    window.sessionStorage.setItem(RECIPE_DEMO_STORAGE_KEY, JSON.stringify(safeRecipes));
    return true;
  } catch (error) {
    return false;
  }
}

function mergeDemoRecipes(demoRecipes) {
  const scratchRecipes = (Array.isArray(demoRecipes) ? demoRecipes : [])
    .map(normalizeStoredDemoRecipe)
    .filter(Boolean);
  const scratchTitles = new Set(scratchRecipes.map((recipe) => recipeIdentityText(recipe.title)));
  const scratchIds = new Set(scratchRecipes.map((recipe) => recipeIdentityText(recipe.id)));
  return builtInRecipeCollection()
    .filter((recipe) => !scratchTitles.has(recipeIdentityText(recipe.title)) && !scratchIds.has(recipeIdentityText(recipe.id)))
    .concat(scratchRecipes)
    .sort((a, b) => a.title.localeCompare(b.title));
}

function normalizedRecipePageLimit(value) {
  const parsed = Number(value);
  if (!Number.isFinite(parsed)) return RECIPE_PAGE_SIZE;
  const wholePages = Math.max(1, Math.ceil(Math.floor(parsed) / RECIPE_PAGE_SIZE));
  return Math.min(RECIPE_CLOUD_MAX_ROWS + RECIPE_PAGE_SIZE, wholePages * RECIPE_PAGE_SIZE);
}

function restoreRecipeBrowseState() {
  try {
    const raw = window.sessionStorage.getItem(RECIPE_BROWSE_STATE_KEY) || "";
    if (!raw) return;
    if (raw.length > 800) throw new Error("browse-state-too-large");
    const saved = JSON.parse(raw);
    if (!saved || saved.version !== 1 || typeof saved !== "object" || Array.isArray(saved)) {
      throw new Error("invalid-browse-state");
    }
    state.searchQuery = typeof saved.searchQuery === "string" ? saved.searchQuery.slice(0, 200) : "";

function captureRecipeFocus() {
  const active = document.activeElement;
  if (!active || !document.getElementById("app")?.contains(active)) return null;
  if (active.id) {
    const snapshot = { type: "id", value: active.id };
    if (typeof active.selectionStart === "number" && typeof active.selectionEnd === "number") {
      snapshot.selectionStart = active.selectionStart;
      snapshot.selectionEnd = active.selectionEnd;
    }
    return snapshot;
  }
  if (active.matches?.(".recipe-card[data-recipe-id]")) {
    return { type: "recipe", value: String(active.getAttribute("data-recipe-id") || "") };
  }
  if (active.matches?.(".category-chip[data-category-index]")) {
    return { type: "category", value: String(active.getAttribute("data-category-index") || "") };
  }
  return null;
}

function restoreRecipeFocus(snapshot) {
  if (!snapshot) return;
  window.requestAnimationFrame(() => {
    let target = null;
    if (snapshot.type === "id") target = document.getElementById(snapshot.value);
    if (snapshot.type === "recipe") {
      target = Array.from(document.querySelectorAll(".recipe-card[data-recipe-id]"))
        .find((card) => card.getAttribute("data-recipe-id") === snapshot.value);
    }
    if (snapshot.type === "category") {
      target = Array.from(document.querySelectorAll(".category-chip[data-category-index]"))
        .find((chip) => chip.getAttribute("data-category-index") === snapshot.value);
    }
    const focusTarget = target || document.querySelector(".detail-title") || document.getElementById("recipe-results-summary");
    focusTarget?.focus?.();
    if (target && Number.isInteger(snapshot.selectionStart) && typeof target.setSelectionRange === "function") {
      const valueLength = String(target.value || "").length;
      target.setSelectionRange(
        Math.min(snapshot.selectionStart, valueLength),
        Math.min(Number.isInteger(snapshot.selectionEnd) ? snapshot.selectionEnd : snapshot.selectionStart, valueLength)
      );
    }
  });
}

function announceRecipeCloudChange(ownerId) {
  if (PUBLIC_DEMO_ONLY || !ownerId) return;
  try {
    window.localStorage.setItem(RECIPE_SYNC_SIGNAL_KEY, JSON.stringify({

      ownerId,
      changedAt: Date.now(),
      nonce: window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`

function scheduleExternalRecipeRefresh() {
  if (PUBLIC_DEMO_ONLY || state.readOnlyBrowse || !["cloud", "stale"].includes(state.recipeMode) || !state.authorizedOwnerId) return;
  if (recipeMutationIsBusy()) {
    externalRecipeRefreshPending = true;
    return;
  }
  externalRecipeRefreshPending = false;
  if (externalRecipeRefreshTimer) window.clearTimeout(externalRecipeRefreshTimer);
  externalRecipeRefreshTimer = window.setTimeout(() => {
    externalRecipeRefreshTimer = null;
    if (recipeMutationIsBusy()) {
      externalRecipeRefreshPending = true;
      return;
    }
    void loadRecipes({ silent: true, preserveFocus: true, keepExistingOnFailure: true });
  }, 180);
}

function flushExternalRecipeRefresh() {
  if (externalRecipeRefreshPending) scheduleExternalRecipeRefresh();

function handleRecipeSyncStorage(event) {
  if (event?.key !== RECIPE_SYNC_SIGNAL_KEY || typeof event.newValue !== "string" || event.newValue.length > 500) return;
  try {
    const signal = JSON.parse(event.newValue);
    if (signal?.version !== 1 || String(signal.ownerId || "").toLowerCase() !== state.authorizedOwnerId) return;
    scheduleExternalRecipeRefresh();
  } catch (error) {
    // Ignore damaged or unrelated same-origin storage signals.
  }

function friendlyAuthError(error) {
  const message = String(error?.message || error || "Something went wrong");
  const lower = message.toLowerCase();
  const code = String(error?.code || "").toLowerCase();
  if (lower.includes("invalid login")) return "Email or password is incorrect.";
  if (lower.includes("email not confirmed")) return "That email and password could not be used. If you recently signed up, check your inbox for a confirmation link.";
  if (code.includes("user_already_exists") || code.includes("email_exists") || code.includes("user_not_found")
      || lower.includes("already registered") || lower.includes("already been registered") || lower.includes("user not found")) {
    return "FlavorNest could not complete that account request. Check the details or use password recovery.";
  }
  if (code.includes("captcha") || lower.includes("captcha")) return "Human verification was not accepted. Please try again.";
  if (code.includes("email_address_not_authorized") || lower.includes("email address not authorized")) return "KiddoSprout email delivery is not ready for that address yet. Please ask the app owner to finish custom email setup.";
  if (code.includes("over_email_send_rate_limit") || lower.includes("rate limit")) return "Too many email requests. Wait a moment, then try again.";
  if (lower.includes("error sending") || lower.includes("smtp") || lower.includes("mailer")) return "KiddoSprout could not send that email right now. Please try again later.";
  if (lower.includes("expired") || lower.includes("invalid token") || lower.includes("invalid otp")) return "That email link or code has expired. Please request a new one.";
  if (lower.includes("account service is unavailable")) return message;
  if (error?.name === "AbortError" || error?.name === "TimeoutError" || lower.includes("timed out") || lower.includes("timeout") || lower.includes("<!doctype") || lower.includes("not valid json") || lower.includes("failed to fetch") || lower.includes("networkerror")) return "Account service is temporarily unavailable.";
  return "FlavorNest could not complete that account request. Please try again.";
}

    container: document.getElementById("auth-human-check"),
    start: document.getElementById("auth-human-check-start"),
    status: document.getElementById("auth-human-check-status")
  };
}

function setAuthHumanCheckStartState(nextState = "idle") {
  const { container, start } = authHumanCheckElements();
  if (container) container.hidden = nextState === "idle";
  if (!start) return;
  const label = start.querySelector(".auth-human-check-label");
  const verified = nextState === "verified";
  const checking = nextState === "checking";
  start.dataset.state = nextState;
  start.disabled = checking || verified;
  start.setAttribute("aria-disabled", String(checking || verified));
  start.setAttribute("aria-pressed", String(verified));
  if (label) label.textContent = verified ? "Human confirmed" : checking ? "Checking…" : "I’m not a robot";
}

function setAuthHumanCheckStatus(message, stateName = "notice") {
  const status = document.getElementById("auth-human-check-status");
  if (!status) return;
  status.hidden = false;
  status.textContent = message;
  status.dataset.state = stateName;
}

function rearmAuthHumanCheck(message = "Tick the box to confirm you’re human.") {
  disposeAuthHumanCheck();
  const { container } = authHumanCheckElements();
  if (container) container.replaceChildren();
  setAuthHumanCheckStartState("idle");
  setAuthHumanCheckStatus(message);
  updateAuthControls();
}

function resetAuthHumanCheck() {
  rearmAuthHumanCheck("Tick the box again for another account request.");
}

function mountAuthHumanCheck() {
  const { container, start } = authHumanCheckElements();
  if (!container || !start || authHumanCheckController || authHumanCheckStarting) return;

  authHumanCheckStarting = true;
  state.authCaptchaToken = "";
  updateAuthControls();
  setAuthHumanCheckStartState("checking");
  setAuthHumanCheckStatus("Starting the safety check…");
  const helper = window.KiddoSproutHumanCheck;
  if (!helper?.render) {
    rearmAuthHumanCheck("Safety check could not start. Tick the box to try again.");
    return;
  }

  const mountId = ++authHumanCheckMountId;
  helper.render(container, {
    statusElement: document.getElementById("auth-human-check-status"),
    widgetOptions: {
      action: "recipe_auth",
      appearance: "always",
      "response-field": false,
      retry: "never",
      "refresh-expired": "never",
      "refresh-timeout": "never",
      size: "flexible",
      theme: document.documentElement.classList.contains("theme-night") ? "dark" : "light"
    },
    onToken(token) {
      if (mountId !== authHumanCheckMountId) return;
      state.authCaptchaToken = token;
      setAuthHumanCheckStartState("verified");
      setAuthHumanCheckStatus("Safety check complete.", "success");
      updateAuthControls();
    },
    onError() {
      if (mountId !== authHumanCheckMountId) return;
      rearmAuthHumanCheck("Safety check failed. Tick the box to try again.");
    },
    onExpired() {
      if (mountId !== authHumanCheckMountId) return;
      rearmAuthHumanCheck("Safety check expired. Tick the box again.");
    },
    onTimeout() {
      if (mountId !== authHumanCheckMountId) return;
      rearmAuthHumanCheck("Safety check timed out. Tick the box to try again.");
    },
    onUnsupported() {
      if (mountId !== authHumanCheckMountId) return;
      rearmAuthHumanCheck("This browser needs an update before the safety check can run.");
    }
  }).then((controller) => {
    if (mountId !== authHumanCheckMountId || !container.isConnected) {
      controller.remove();
      return;
    }
    authHumanCheckController = controller;
    authHumanCheckStarting = false;
    if (!state.authCaptchaToken) setAuthHumanCheckStatus("Finish the Cloudflare check below.");
  }).catch(() => {
    if (mountId !== authHumanCheckMountId) return;
    rearmAuthHumanCheck("Safety check could not start. Tick the box to try again.");
  });
}

// ---- Exact-dish photo lookup ----
// Tier 1: TheMealDB (curated real food photography, exact-name match)
// Tier 2: Wikipedia (real encyclopedia photo, covers most named world dishes)
//
// Successful lookups are saved to localStorage so the same dish always shows the same
// photo on every future visit, instead of re-querying (and sometimes failing) on every reload.
const PHOTO_CACHE_KEY = "recipeBoxPhotoCache_v1";
const PHOTO_LOOKUP_CONCURRENCY = 4;
const PHOTO_LOOKUP_QUEUE_MAX = 60;
const PHOTO_CACHE_MAX_ENTRIES = 300;
const PHOTO_CACHE_MAX_CHARACTERS = 500000;
const PHOTO_RESPONSE_MAX_BYTES = 1024 * 1024;
const PHOTO_REQUEST_TIMEOUT_MS = 8000;

function loadPhotoCache() {
  const cache = Object.create(null);
  try {
    const raw = localStorage.getItem(PHOTO_CACHE_KEY) || "";
    if (!raw) return cache;
    if (raw.length > PHOTO_CACHE_MAX_CHARACTERS) {
      localStorage.removeItem(PHOTO_CACHE_KEY);
      return cache;
    }
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
      localStorage.removeItem(PHOTO_CACHE_KEY);
      return cache;
    }
    Object.entries(parsed).slice(-PHOTO_CACHE_MAX_ENTRIES).forEach(([rawKey, rawUrl]) => {
      const key = recipeIdentityText(rawKey).slice(0, 160);
      const url = safeRecipeImageUrl(rawUrl);
      if (key && url) cache[key] = url;
    });
  } catch (error) {
    // A damaged or unavailable cache must never stop the recipe book.
    try { localStorage.removeItem(PHOTO_CACHE_KEY); } catch (storageError) {}
  }
  return cache;
}

let persistedPhotoCache = loadPhotoCache();
function savePhotoCache() {
  try { localStorage.setItem(PHOTO_CACHE_KEY, JSON.stringify(persistedPhotoCache)); } catch (e) { /* storage unavailable, safe to ignore */ }
}
const exactPhotoCache = Object.assign(Object.create(null), persistedPhotoCache); // title (lowercased) -> final ready-to-use url, or null (session-only if null)
const exactPhotoRequests = new Map();
const queuedPhotoLookups = [];
let activePhotoLookups = 0;
let photoHydrationTimer = null;
let photoHydrationGeneration = 0;
let photoHydrationObserver = null;

function rememberRecipePhoto(key, value) {
  const url = safeRecipeImageUrl(value);
  if (!key || !url) return "";
  delete persistedPhotoCache[key];
  persistedPhotoCache[key] = url;
  while (Object.keys(persistedPhotoCache).length > PHOTO_CACHE_MAX_ENTRIES) {
    delete persistedPhotoCache[Object.keys(persistedPhotoCache)[0]];
  }
  exactPhotoCache[key] = url;
  savePhotoCache();
  return url;
}

function forgetRecipePhoto(key, failedUrl) {
  const normalizedKey = recipeIdentityText(key);
  const normalizedUrl = safeRecipeImageUrl(failedUrl);
  if (!normalizedKey || !Object.prototype.hasOwnProperty.call(exactPhotoCache, normalizedKey)) return;
  if (normalizedUrl && exactPhotoCache[normalizedKey] !== normalizedUrl) return;
  delete exactPhotoCache[normalizedKey];
  delete persistedPhotoCache[normalizedKey];
  savePhotoCache();
}

function drainPhotoLookupQueue() {
  while (activePhotoLookups < PHOTO_LOOKUP_CONCURRENCY && queuedPhotoLookups.length > 0) {
    const job = queuedPhotoLookups.shift();
    activePhotoLookups += 1;
    Promise.resolve()
      .then(job.lookup)
      .then(job.resolve, job.reject)
      .finally(() => {
        activePhotoLookups -= 1;
        drainPhotoLookupQueue();
      });
  }
}

function queuePhotoLookup(lookup) {
  return new Promise((resolve, reject) => {
    if (queuedPhotoLookups.length >= PHOTO_LOOKUP_QUEUE_MAX) {
      queuedPhotoLookups.shift().resolve(null);
    }
    queuedPhotoLookups.push({ lookup, resolve, reject });
    drainPhotoLookupQueue();
  });
}

async function readBoundedPhotoText(response) {
  const reader = response.body && typeof response.body.getReader === "function"
    ? response.body.getReader()
    : null;
  if (!reader) return "";
  const chunks = [];
  let total = 0;
  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = value instanceof Uint8Array ? value : new Uint8Array(value || []);
      total += chunk.byteLength;
      if (total > PHOTO_RESPONSE_MAX_BYTES) {
        await reader.cancel("response-too-large").catch(() => {});
        return "";
      }
      chunks.push(chunk);
    }
  } finally {
    try { reader.releaseLock(); } catch (error) {}
  }
  const combined = new Uint8Array(total);
  let offset = 0;
  chunks.forEach((chunk) => {
    combined.set(chunk, offset);
    offset += chunk.byteLength;
  });
  return new TextDecoder("utf-8", { fatal: true }).decode(combined);
}

async function fetchRecipePhotoJson(url) {
  const controller = typeof AbortController === "function" ? new AbortController() : null;
  const timeout = controller ? window.setTimeout(() => controller.abort(), PHOTO_REQUEST_TIMEOUT_MS) : null;
  try {
    const response = await fetch(url, {
      headers: { Accept: "application/json" },
      cache: "default",
      credentials: "omit",
      mode: "cors",
      referrerPolicy: "no-referrer",
      signal: controller ? controller.signal : undefined
    });
    if (!response.ok) return null;
    const contentType = String(response.headers.get("content-type") || "").toLowerCase();
    const declaredLength = Number(response.headers.get("content-length") || 0);
    if (!contentType.includes("json") || (Number.isFinite(declaredLength) && declaredLength > PHOTO_RESPONSE_MAX_BYTES)) return null;
    const text = await readBoundedPhotoText(response);
    if (!text) return null;
    const parsed = JSON.parse(text);
    return parsed && typeof parsed === "object" ? parsed : null;
  } catch (error) {
    return null;
  } finally {
    if (timeout) window.clearTimeout(timeout);
  }
}

async function fetchExactPhotoUncached(title, key) {

  // Tier 1: TheMealDB
  try {
    const data = await fetchRecipePhotoJson(`https://www.themealdb.com/api/json/v1/1/search.php?s=${encodeURIComponent(title)}`);
    const wantedTitle = recipeIdentityText(title);
    const exactMeal = Array.isArray(data?.meals)
      ? data.meals.find((meal) => meal && recipeIdentityText(meal.strMeal) === wantedTitle)
      : null;
    const thumb = exactMeal && typeof exactMeal.strMealThumb === "string" ? exactMeal.strMealThumb : null;
    if (thumb) {
      const finalUrl = safeRecipeImageUrl(thumb + "/preview");
      if (finalUrl) {
        return rememberRecipePhoto(key, finalUrl);
      }
    }
  } catch (err) { /* fall through to next tier */ }

  // Tier 2: Wikipedia
  try {
    const exactWikiUrl = `https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&redirects=1&prop=pageimages&pithumbsize=500&format=json&origin=*`;
    const exactData = await fetchRecipePhotoJson(exactWikiUrl);
    const exactPages = exactData && exactData.query && exactData.query.pages;
    if (exactPages) {
      const exactPage = Object.values(exactPages).find((page) => page && !page.missing && page.thumbnail && page.thumbnail.source);
      if (exactPage) {
        const finalUrl = safeRecipeImageUrl(exactPage.thumbnail.source);
        if (finalUrl) {
          return rememberRecipePhoto(key, finalUrl);
        }
      }
    }

  } catch (err) { /* fall through to the initials placeholder */ }

  // No match this time — don't persist the miss, so it gets another chance on the next visit
  // instead of being permanently stuck without a real photo.
  exactPhotoCache[key] = null;
  return null;
}

function fetchExactPhoto(title) {
  const key = recipeIdentityText(title);
  if (!key) return Promise.resolve(null);
  if (Object.prototype.hasOwnProperty.call(exactPhotoCache, key)) return Promise.resolve(exactPhotoCache[key]);
  if (exactPhotoRequests.has(key)) return exactPhotoRequests.get(key);

  const request = queuePhotoLookup(() => fetchExactPhotoUncached(title, key))
    .finally(() => exactPhotoRequests.delete(key));
  exactPhotoRequests.set(key, request);
  return request;
}

async function hydrateExactPhotos(recipes, generation = photoHydrationGeneration) {
  if (isKiddoSproutDemoMode() || generation !== photoHydrationGeneration) return;
  const builtInRecipes = (Array.isArray(recipes) ? recipes : [])
    .filter((recipe) => recipe && recipe._source !== "cloud");
  for (let offset = 0; offset < builtInRecipes.length; offset += PHOTO_LOOKUP_QUEUE_MAX) {
    if (isKiddoSproutDemoMode() || generation !== photoHydrationGeneration) return;
    const chunk = builtInRecipes.slice(offset, offset + PHOTO_LOOKUP_QUEUE_MAX);
    await Promise.all(chunk.map(async (r) => {
      const url = safeRecipeImageUrl(await fetchExactPhoto(r.title));
      const currentRecipe = state.recipes.find((recipe) => recipe.id === r.id);
      if (!url || isKiddoSproutDemoMode() || !currentRecipe || currentRecipe._source === "cloud"
          || recipeIdentityText(currentRecipe.title) !== recipeIdentityText(r.title)) return;
      Array.from(document.querySelectorAll("img[data-recipe-img]"))
        .filter((img) => img.getAttribute("data-recipe-img") === String(r.id))
        .forEach((img) => {
          img.src = url;
          if (img.complete) handleRecipePhotoLoad({ target: img });
        });
    }));
  }
}

function cancelExactPhotoHydration() {
  photoHydrationGeneration += 1;
  if (photoHydrationTimer) window.clearTimeout(photoHydrationTimer);
  photoHydrationTimer = null;
  photoHydrationObserver?.disconnect();
  photoHydrationObserver = null;
}

function scheduleExactPhotoHydration(recipes) {
  cancelExactPhotoHydration();
  const generation = photoHydrationGeneration;
  if (isKiddoSproutDemoMode()) return;
  const batch = Array.isArray(recipes) ? recipes.slice() : [];
  photoHydrationTimer = window.setTimeout(() => {
    photoHydrationTimer = null;
    if (generation !== photoHydrationGeneration || !batch.length) return;
    const recipesById = new Map(batch.map((recipe) => [String(recipe?.id || ""), recipe]));
    const images = [...document.querySelectorAll("img[data-recipe-img]")]
      .filter((image) => recipesById.has(String(image.dataset.recipeImg || "")));
    if (!images.length) return;

    // Exact-photo searches can require several cross-origin API requests per
    // dish. Start them only when the matching card is near the viewport so a
    // long recipe page does not spend bandwidth on off-screen photography.
    if (typeof IntersectionObserver !== "function") {
      void hydrateExactPhotos(batch, generation).catch(() => {});
      return;
    }
    photoHydrationObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        observer.unobserve(entry.target);
        const recipeId = String(entry.target.dataset.recipeImg || "");
        const recipe = recipesById.get(recipeId);
        if (!recipe) return;
        recipesById.delete(recipeId);
        void hydrateExactPhotos([recipe], generation).catch(() => {});
      });
      if (!recipesById.size) {
        observer.disconnect();
        if (photoHydrationObserver === observer) photoHydrationObserver = null;
      }
    }, { rootMargin: "320px 0px" });
    images.forEach((image) => photoHydrationObserver.observe(image));
  }, 160);
}

// ---- Supabase Auth REST helpers ----
function authRequestSignal(timeoutMs = AUTH_REQUEST_TIMEOUT_MS) {
  if (typeof AbortSignal !== "undefined" && typeof AbortSignal.timeout === "function") {
    return AbortSignal.timeout(timeoutMs);
  }
  if (typeof AbortController === "undefined") return undefined;
  const controller = new AbortController();
  window.setTimeout(() => controller.abort(), timeoutMs);
  return controller.signal;
}

async function authRequest(path, body) {
  if (!SUPABASE_CONNECTED) {
    throw new Error("Account service is unavailable. Check the app configuration.");
  }
  const res = await fetch(`${SUPABASE_URL}/auth/v1/${path}`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_PUBLISHABLE_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body),
    cache: "no-store",
    signal: authRequestSignal(),
  });
  const contentType = res.headers.get("content-type") || "";
  const data = contentType.includes("application/json")
    ? await res.json()
    : { error: await res.text() };
  if (!res.ok) {
    const error = new Error(data.error_description || data.msg || data.error || "Something went wrong");
    error.code = data.error_code || data.code || "";
    error.status = res.status;
    throw error;
  }
  return data;
}
function authRedirectUrl() {
  return window.location.origin + window.location.pathname;
}
function recipeAuthNonce() {
  const randomBytes = new Uint8Array(32);
  window.crypto.getRandomValues(randomBytes);
  return window.btoa(String.fromCharCode(...randomBytes))
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/g, "");
}
function validRecipeAuthEmail(value) {
  const email = String(value || "").trim().toLowerCase();
  return email.length <= 254 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}
async function recipeAuthEmailFingerprint(email, nonce) {
  const normalizedEmail = String(email || "").trim().toLowerCase();
  const normalizedNonce = String(nonce || "");
  if (!validRecipeAuthEmail(normalizedEmail)
      || !/^[A-Za-z0-9_-]{43}$/.test(normalizedNonce)
      || !window.crypto?.subtle
      || typeof TextEncoder !== "function") {
    throw new Error("Secure browser storage is unavailable. Open this page outside private browsing and try again.");
  }
  const digest = new Uint8Array(await window.crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(normalizedNonce + "\u0000" + normalizedEmail)
  ));
  return window.btoa(String.fromCharCode(...digest))
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/g, "");
}
async function createRecipePasswordRecoveryTransaction(email) {
  const nonce = recipeAuthNonce();
  const transaction = {
    nonce,
    emailFingerprint: await recipeAuthEmailFingerprint(email, nonce),
    createdAt: Date.now()
  };
  try {
    window.localStorage.setItem(RECIPE_PASSWORD_RECOVERY_TRANSACTION_KEY, JSON.stringify(transaction));
  } catch (error) {
    throw new Error("Secure browser storage is unavailable. Open this page outside private browsing and try again.");
  }
  return transaction;
}
function readRecipePasswordRecoveryTransaction(returnedNonce) {
  let serialized = "";
  try {
    serialized = window.localStorage.getItem(RECIPE_PASSWORD_RECOVERY_TRANSACTION_KEY) || "";
  } catch (error) {
    return null;
  }
  if (!serialized || !returnedNonce) return null;
  try {
    const transaction = JSON.parse(serialized);
    const age = Date.now() - Number(transaction?.createdAt);
    const valid = /^[A-Za-z0-9_-]{43}$/.test(String(transaction?.nonce || ""))
      && transaction.nonce === returnedNonce
      && /^[A-Za-z0-9_-]{43}$/.test(String(transaction?.emailFingerprint || ""))
      && Number.isFinite(age)
      && age >= 0
      && age <= RECIPE_PASSWORD_RECOVERY_TRANSACTION_TTL_MS;
    if (valid) return transaction;
  } catch (error) {
    // Clear malformed recovery state below.
  }
  try { window.localStorage.removeItem(RECIPE_PASSWORD_RECOVERY_TRANSACTION_KEY); } catch (error) {}
  return null;
}
function passwordRecoveryRedirectUrl(transactionNonce) {
  const redirect = new URL(authRedirectUrl());
  redirect.searchParams.set(RECIPE_PASSWORD_RECOVERY_TRANSACTION_PARAM, transactionNonce);
  return redirect.toString();
}
function captchaProtectedBody(body, captchaToken) {
  const token = String(captchaToken || "").trim();
  if (!token) throw new Error("Confirm you are not a bot before continuing.");
  return {
    ...body,
    gotrue_meta_security: { captcha_token: token }
  };
}
function signUpRequest(email, password, captchaToken) {
  const redirect = encodeURIComponent(authRedirectUrl());
  return authRequest(`signup?redirect_to=${redirect}`, captchaProtectedBody({ email, password }, captchaToken));
}
function signInRequest(email, password, captchaToken) {
  return authRequest("token?grant_type=password", captchaProtectedBody({ email, password }, captchaToken));
}
function resendConfirmationRequest(email, captchaToken) {
  const redirect = encodeURIComponent(authRedirectUrl());
  return authRequest(
    `resend?redirect_to=${redirect}`,
    captchaProtectedBody({ type: "signup", email }, captchaToken)
  );
}
function recoverPasswordRequest(email, captchaToken, transactionNonce) {
  const redirect = encodeURIComponent(passwordRecoveryRedirectUrl(transactionNonce));
  return authRequest(`recover?redirect_to=${redirect}`, captchaProtectedBody({ email }, captchaToken));
}
async function updatePasswordRequest(access_token, password) {
  if (!SUPABASE_CONNECTED) {
    throw new Error("Account service is unavailable. Check the app configuration.");
  }
  const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
    method: "PUT",
    headers: {
      apikey: SUPABASE_PUBLISHABLE_KEY,
      Authorization: `Bearer ${access_token}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ password }),
    cache: "no-store",
    signal: authRequestSignal()
  });
  const contentType = res.headers.get("content-type") || "";
  const data = contentType.includes("application/json")
    ? await res.json()
    : { error: await res.text() };
  if (!res.ok) {
    const error = new Error(data.error_description || data.msg || data.error || "Could not update password");
    error.code = data.error_code || data.code || data.error || "";
    error.status = res.status;
    throw error;
  }
  return data;
}
async function fetchRecipeRecoveryUser(access_token) {
  if (!SUPABASE_CONNECTED) {
    throw new Error("Account service is unavailable. Check the app configuration.");
  }
  const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
    headers: {
      apikey: SUPABASE_PUBLISHABLE_KEY,
      Authorization: `Bearer ${access_token}`
    },
    cache: "no-store",
    signal: authRequestSignal()
  });
  const contentType = res.headers.get("content-type") || "";
  const data = contentType.includes("application/json")
    ? await res.json()
    : { error: await res.text() };
  if (!res.ok || !validRecipeAuthEmail(data?.email)) {
    const error = new Error(data.error_description || data.msg || data.error || "The password reset link could not be verified.");
    error.code = data.error_code || data.code || data.error || "";
    error.status = res.status;
    throw error;
  }
  return data;
}
async function endRecipeAuthSession(accessToken) {
  if (!SUPABASE_CONNECTED || !accessToken) return false;
  try {
    const response = await fetch(`${SUPABASE_URL}/auth/v1/logout?scope=local`, {
      method: "POST",
      headers: {
        apikey: SUPABASE_PUBLISHABLE_KEY,
        Authorization: `Bearer ${accessToken}`
      },
      cache: "no-store",
      signal: authRequestSignal(5000)
    });
    return response.ok;
  } catch (error) {
    return false;
  }
}

// ---- Shared session bridge ----
function persistSession(session) {
  const sessionApi = sharedRecipeSession();
  const saved = sessionApi.save(session);
  const storedSession = saved === false ? null : sessionApi.getSession();
  return Boolean(
    storedSession?.access_token
    && String(storedSession.access_token) === String(session?.access_token || "")
    && String(storedSession.user?.id || "") === String(session?.user?.id || "")
  );
}

function acceptRecipeSession(session) {
  if (!session?.user?.email_confirmed_at && !session?.user?.confirmed_at) {
    throw new Error("Email not confirmed");
  }
  if (persistSession(session)) return session;
  void endRecipeAuthSession(session?.access_token);
  throw new Error("This browser could not save your sign-in. Check its storage or private-browsing settings, then try again.");
}

function clearPersistedSession() {
  window.KiddoSproutSession?.clear?.();
}

function readPersistedSession() {
  if (isKiddoSproutDemoMode()) return null;
  return window.KiddoSproutSession?.getSession?.() || null;
}

function getCategories() {
  const set = new Set(state.recipes.map((r) => r.category || "Other"));
  const priorityCategories = [
    "Family Favourites", "Rice", "Soup", "Snacks", "Pasta", "Breakfast",
    "Vegetarian", "Mexican", "Italian", "Indian", "Nigerian"
  ];
  const categories = Array.from(set).sort((a, b) => a.localeCompare(b));
  return [
    "All",
    ...priorityCategories.filter((category) => set.has(category)),
    ...categories.filter((category) => !priorityCategories.includes(category))
  ];
}
function reconcileSelectedRecipeCategory(categories) {
  if (!categories.includes(state.selectedCategory)) {
    state.selectedCategory = "All";
    resetRecipePage();
  }
}
function normalizeRecipeSearchText(value) {
  return String(value == null ? "" : value)
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLocaleLowerCase("en-GB")
    .replace(/\s+/g, " ")
    .trim();
}
function getFilteredRecipes() {
  const q = normalizeRecipeSearchText(state.searchQuery).slice(0, 200);
  const queryWords = q.split(" ").filter(Boolean);
  return state.recipes.filter((r) => {
    const matchesCategory = state.selectedCategory === "All" || (r.category || "Other") === state.selectedCategory;
    if (!matchesCategory || !q) return matchesCategory;
    const searchableText = normalizeRecipeSearchText([
      r.title,
      r.category,
      ...(Array.isArray(r.ingredients) ? r.ingredients : [])
    ].join(" "));
    const matchesSearch = queryWords.every((word) => searchableText.includes(word));
    return matchesCategory && matchesSearch;
  });
}

  const visibleLimit = normalizedRecipePageLimit(state.visibleRecipeLimit);
  const visible = recipes.slice(0, visibleLimit);
  const remaining = Math.max(0, recipes.length - visible.length);
  return {
    visible,
    total: recipes.length,
    remaining,
    nextCount: Math.min(RECIPE_PAGE_SIZE, remaining)
  };
}

function isEditableRecipe(recipe) {
  if (isOwnedCloudRecipe(recipe)) return true;
  return Boolean(canWriteDemoRecipes() && recipe?._source === "demo");
}

function recipeFallbackDetails(error) {
  const kind = String(error?.kind || "unavailable");
  if (kind === "schema_missing") {
    return {
      kind,
      notice: "Family recipe storage has not been installed yet. You can still browse the built-in recipes, but saving is off."
    };
  }
  if (kind === "auth") {
    return {
      kind,
      notice: "Your recipe session has expired. Built-in recipes are available read-only; log out and back in before saving."
    };
  }
  if (kind === "permission") {
    return {
      kind,
      notice: "Family recipe storage permissions need attention. Built-in recipes are available read-only and nothing is being synced."
    };
  }
  if (kind === "network" || kind === "timeout" || kind === "unavailable") {
    return {
      kind,
      notice: "Cloud recipes cannot be reached right now. You are viewing the built-in recipe book only, and saving is paused."
    };
  }
  if (kind === "session_refresh_unavailable") {
    return {
      kind,
      notice: "Your saved sign-in has been kept, but the account service could not refresh it right now. Built-in recipes are available read-only until you try again."
    };
  }
  return {
    kind,
    notice: "Cloud recipes could not be loaded safely. You are viewing built-in recipes only, and saving is paused."
  };
}

function showBuiltInRecipeFallback(error) {
  const details = recipeFallbackDetails(error);
  state.cloudRecipes = [];
  state.recipes = builtInRecipeCollection();
  state.recipeMode = "built-in";
  state.recipeNotice = details.notice;
  state.cloudErrorKind = details.kind;
}

function prepareReadOnlyRecipeBrowse(recipeMode, notice, cloudErrorKind = "") {
  recipeLoadRevision += 1;
  recipeMutationRevision += 1;
  state.authChecked = true;
  state.session = null;
  state.authorizedOwnerId = "";
  kiddoSproutGate = null;
  state.readOnlyBrowse = true;
  state.recipeMode = recipeMode;
  state.recipeNotice = notice;
  state.recipeActionNotice = "";
  state.cloudErrorKind = cloudErrorKind;
  state.cloudChecking = false;
  state.cloudRecipes = [];
  state.demoRecipes = recipeMode === "demo" ? readDemoRecipes() : [];
  state.recipes = recipeMode === "demo"
    ? mergeDemoRecipes(state.demoRecipes)
    : builtInRecipeCollection();
  state.recipesLoaded = true;
  state.screen = "browse";
  state.selectedRecipeId = null;
  state.editingRecipeId = null;
  state.detailError = "";
  state.detailSubmitting = false;
  state.addError = "";
  state.addSubmitting = false;
  browseReturnRecipeId = "";
  render();
}

function startReadOnlyRecipeBrowse() {
  prepareReadOnlyRecipeBrowse(
    "demo",
    "Interactive demo recipe book: add, edit, and remove made-up recipes. Changes stay only in this tab; accounts and cloud syncing remain off."
  );
}

function startUnconfiguredRecipeBrowse() {
  prepareReadOnlyRecipeBrowse(

    "configuration"
  );

// ---- Actions ----
function clearAuthCallbackUrl() {
  const cleanUrl = new URL(window.location.href);
  [
    "access_token", "code", "error", "error_code", "error_description", "expires_at",
    "expires_in", "provider_refresh_token", "provider_token", "refresh_token", "token_type", "type"
  ].forEach((name) => cleanUrl.searchParams.delete(name));
  cleanUrl.searchParams.delete(RECIPE_PASSWORD_RECOVERY_TRANSACTION_PARAM);
  cleanUrl.hash = "";
  window.history.replaceState(null, "", cleanUrl.pathname + cleanUrl.search);
}

function readAuthCallback() {
  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  const query = new URLSearchParams(window.location.search);
  const getParam = (name) => hash.get(name) || query.get(name);
  const type = getParam("type");
  const accessToken = hash.get("access_token");
  const refreshToken = hash.get("refresh_token");
  const callbackError = getParam("error_description") || getParam("error");
  const callbackErrorCode = getParam("error_code") || "";
  const returnedRecoveryNonce = query.get(RECIPE_PASSWORD_RECOVERY_TRANSACTION_PARAM) || "";
  const recoveryTransaction = returnedRecoveryNonce
    ? readRecipePasswordRecoveryTransaction(returnedRecoveryNonce)
    : null;

  if (query.has("access_token") || query.has("refresh_token") || query.has("provider_token") || query.has("provider_refresh_token")) {
    state.authChecked = true;
    state.authMode = "login";
    state.authInfo = "";
    state.authError = "That account link was not safe to use. Please request a new email.";
    try { window.localStorage.removeItem(RECIPE_PASSWORD_RECOVERY_TRANSACTION_KEY); } catch (error) {}
    clearAuthCallbackUrl();
    render();
    return true;
  }

  if (callbackError) {
    state.authChecked = true;
    state.authMode = "login";
    state.authInfo = "";
    state.authError = callbackErrorCode === "otp_expired"
      ? "This email link has expired. Try logging in, or sign up again to request a new confirmation email."
      : "We could not finish that email link. Please try logging in or request a new email.";
    if (returnedRecoveryNonce) {
      state.authError = callbackErrorCode === "otp_expired"
        ? "This password reset link expired. Request a new one."
        : "We could not finish that password reset link. Request a new one.";
      try { window.localStorage.removeItem(RECIPE_PASSWORD_RECOVERY_TRANSACTION_KEY); } catch (error) {}
    }
    clearAuthCallbackUrl();
    render();
    return true;
  }

  if (type === "recovery" && accessToken) {
    if (!recoveryTransaction) {
      state.authChecked = true;
      state.authMode = "login";
      state.authInfo = "";
      state.authError = "For safety, this password reset link must be opened in the browser that requested it. Request a new link.";
      clearAuthCallbackUrl();
      render();
      return true;
    }
    state.recoveryMode = true;
    state.recoveryAccessToken = accessToken;
    state.recoveryEmailFingerprint = recoveryTransaction.emailFingerprint;
    state.recoveryNonce = recoveryTransaction.nonce;
    state.recoveryError = "";
    state.recoveryInfo = "Reset link verified. Choose and confirm your new password.";
    state.authChecked = true;
    try { window.localStorage.removeItem(RECIPE_PASSWORD_RECOVERY_TRANSACTION_KEY); } catch (error) {}
    clearAuthCallbackUrl();
    render();
    return true;
  }

  if (type === "signup" && accessToken && refreshToken) {
    state.authChecked = true;
    state.authMode = "login";
    state.authError = "";
    state.authInfo = "Email confirmed. You can log in now.";
    clearAuthCallbackUrl();
    render();
    return true;
  }

  return false;
}

async function restoreSession() {
  if (readAuthCallback()) {
    return;
  }
  state.authChecked = false;
  state.cloudChecking = true;
  render();
  try {
    const storedSession = readPersistedSession();
    if (!storedSession) {
      state.session = null;
      state.authorizedOwnerId = "";
      return;
    }
    const access = await validatedRecipeAccess();
    state.session = access.session;
    const allowed = await canOpenKiddoSproutApp("recipe", APP_NAME);
    if (allowed) await loadRecipes();
  } catch (error) {
    state.authorizedOwnerId = "";
    const temporary = window.KiddoSproutSession?.isTemporaryError?.(error)
      || error?.kind === "session_refresh_unavailable";
    if (temporary) {
      showKiddoSproutGate(
        "Parent check temporarily unavailable",
        "KiddoSprout could not safely verify this parent session. The saved sign-in is safe; try again when the connection returns.",
        { retry: true }
      );
    } else {
      state.session = null;
      clearPersistedSession();
    }
  } finally {
    state.authChecked = true;
    state.cloudChecking = false;
    render();
  }
}

function retryKiddoSproutGate() {
  if (recipeGateRetryInFlight) return recipeGateRetryInFlight;
  if (kiddoSproutGate?.retry !== true) return Promise.resolve(false);
  kiddoSproutGate = null;
  recipeGateRetryInFlight = (async () => {
    try {
      await restoreSession();
      return kiddoSproutGate === null;
    } catch (error) {
      showKiddoSproutGate(
        "Parent check temporarily unavailable",
        "KiddoSprout still cannot verify this parent session. Check the connection and try again.",
        { retry: true }
      );
      render();
      return false;
    }
  })().finally(() => {
    recipeGateRetryInFlight = null;
  });
  return recipeGateRetryInFlight;
}

function retryRecipeCloud() {
  if (state.cloudErrorKind === "session_refresh_unavailable") {
    state.cloudChecking = true;
    render();
    return restoreSession();
  }
  if (state.recipeMode === "stale") {
    return loadRecipes({ keepExistingOnFailure: true, preserveFocus: true });
  }
  return loadRecipes();
}

async function handleRecipePasswordUpdate(password, confirmation) {
  if (state.recoverySubmitting) return;
  state.recoveryError = "";
  state.recoveryInfo = "";
  if (!password || password.length < 8) {
    state.recoveryError = "Password must be at least 8 characters.";
    syncRecipeRecoveryFeedback("recipe-new-password");
    return;
  }
  if (password !== confirmation) {
    state.recoveryError = "The two new passwords do not match.";
    syncRecipeRecoveryFeedback("recipe-confirm-password");
    return;
  }
  const accessToken = String(state.recoveryAccessToken || "");
  const expectedFingerprint = String(state.recoveryEmailFingerprint || "");
  const recoveryNonce = String(state.recoveryNonce || "");
  if (!accessToken
      || !/^[A-Za-z0-9_-]{43}$/.test(expectedFingerprint)
      || !/^[A-Za-z0-9_-]{43}$/.test(recoveryNonce)) {
    state.recoveryError = "The password reset link is no longer available. Request a new one.";
    syncRecipeRecoveryFeedback("recipe-reset-error");
    return;
  }
  const revision = ++recoveryOperationRevision;
  state.recoverySubmitting = true;
  state.recoveryInfo = "Updating your password…";
  syncRecipeRecoveryFeedback("recipe-reset-info");
  updateRecipeRecoveryControls();
  try {
    const verifiedUser = await fetchRecipeRecoveryUser(accessToken);
    if (revision !== recoveryOperationRevision || accessToken !== state.recoveryAccessToken) return;
    if (await recipeAuthEmailFingerprint(verifiedUser.email, recoveryNonce) !== expectedFingerprint) {
      throw new Error("The password reset link does not match the account requested in this browser.");
    }
    const user = await updatePasswordRequest(accessToken, password);
    if (revision !== recoveryOperationRevision || accessToken !== state.recoveryAccessToken) return;
    if (String(user?.id || "") !== String(verifiedUser?.id || "")
        || String(user?.email || "").trim().toLowerCase()
          !== String(verifiedUser?.email || "").trim().toLowerCase()) {
      throw new Error("The password reset account changed before it could be saved.");
    }
    await endRecipeAuthSession(accessToken);
    if (revision !== recoveryOperationRevision) return;
    state.authError = "";
    state.authInfo = "Password updated. You can log in now.";
    state.recoveryInfo = "";
    state.recoveryMode = false;
    state.recoveryAccessToken = "";
    state.recoveryEmailFingerprint = "";
    state.recoveryNonce = "";
    state.authMode = "login";
  } catch (err) {
    if (revision !== recoveryOperationRevision) return;
    state.recoveryInfo = "";
    state.recoveryError = friendlyAuthError(err);
  } finally {
    if (revision === recoveryOperationRevision) {
      state.recoverySubmitting = false;
      render();
    }
  }
}

function cancelRecipePasswordRecovery() {
  const accessToken = String(state.recoveryAccessToken || "");
  recoveryOperationRevision += 1;
  state.recoverySubmitting = false;
  state.recoveryMode = false;
  state.recoveryAccessToken = "";
  state.recoveryEmailFingerprint = "";
  state.recoveryNonce = "";
  state.recoveryError = "";
  state.recoveryInfo = "";
  state.authMode = "login";
  state.authInfo = "Password reset cancelled. You can request a new link at any time.";
  try { window.localStorage.removeItem(RECIPE_PASSWORD_RECOVERY_TRANSACTION_KEY); } catch (error) {}
  if (accessToken) void endRecipeAuthSession(accessToken);
  requestNextAuthFocus("auth-info");
  render();
}

async function loadRecipes(options = {}) {
  if (PUBLIC_DEMO_ONLY || state.readOnlyBrowse) {
    startReadOnlyRecipeBrowse();
    return;
  }
  const focusSnapshot = options.preserveFocus === true ? captureRecipeFocus() : null;
  const expectedOwnerId = String(state.authorizedOwnerId || "").trim().toLowerCase();
  if (!expectedOwnerId) {
    showKiddoSproutGate("Parent check needed", "Return to KiddoSprout so FlavorNest can verify the current child settings.");
    return;
  }
  const loadRevision = ++recipeLoadRevision;
  const isCurrentLoad = () => loadRevision === recipeLoadRevision
    && state.authorizedOwnerId === expectedOwnerId
    && String(window.KiddoSproutSession?.getSession?.()?.user?.id || "").trim().toLowerCase() === expectedOwnerId;
  if (options.silent !== true) state.recipeActionNotice = "";
  state.cloudChecking = true;
  if (state.recipesLoaded && options.silent !== true) render();
  try {
    const access = await validatedRecipeAccess(expectedOwnerId);
    if (!isCurrentLoad()) return;
    state.session = access.session;
    const cloudRecipes = await fetchAllRecipes(access.accessToken, access.ownerId);
    if (!isCurrentLoad()) return;
    state.cloudRecipes = cloudRecipes;
    state.recipes = mergeFamilyRecipes(state.cloudRecipes);
    state.recipeMode = "cloud";
    state.recipeNotice = "Family recipes are synced for this account. New recipes are saved privately for this signed-in family.";
    state.cloudErrorKind = "";
    state.loadError = "";
  } catch (err) {
    if (!isCurrentLoad()) return;
    if (options.keepExistingOnFailure === true && state.recipesLoaded && state.cloudRecipes.length > 0) {
      const details = recipeFallbackDetails(err);
      state.recipeMode = "stale";
      state.recipeNotice = "Cloud recipes could not be refreshed. Your previously synced recipes remain visible read-only; saving is paused until cloud access returns.";
      state.cloudErrorKind = details.kind;
    } else {
      showBuiltInRecipeFallback(err);
    }
    state.loadError = "";
  } finally {
    if (!isCurrentLoad()) return;
    state.cloudChecking = false;
    state.recipesLoaded = true;
    render();
    restoreRecipeFocus(focusSnapshot);
    flushExternalRecipeRefresh();
  }
}

async function handleAuthSubmit(email, password, captchaToken) {
  if (state.authSubmitting) return;
  const operationMode = state.authMode;
  const operationRevision = ++authOperationRevision;
  state.authEmail = String(email || "").trim().slice(0, 254);
  state.authError = "";
  state.authInfo = "";
  if (state.authMode === "signup" && !AUTH_EMAIL_DELIVERY_READY) {
    state.authError = EMAIL_DELIVERY_UNAVAILABLE_MESSAGE;
    syncAuthFeedback("auth-error");
    return;
  }
  if (!captchaToken) {
    state.authError = "Confirm you are not a bot before continuing.";
    syncAuthFeedback("auth-human-check-start");
    return;
  }
  state.authSubmitting = true;
  state.authInfo = operationMode === "signup" ? "Creating your account…" : "Signing you in…";
  syncAuthFeedback("auth-info");
  updateAuthControls();
  let shouldLoadRecipes = false;
  try {
    if (operationMode === "signup") {
      const data = await signUpRequest(email, password, captchaToken);
      if (operationRevision !== authOperationRevision || state.authMode !== operationMode) {
        if (data?.access_token) void endRecipeAuthSession(data.access_token);
        return;
      }
      if (data.access_token) {
        state.session = acceptRecipeSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user });
        state.authInfo = "";
        shouldLoadRecipes = await canOpenKiddoSproutApp("recipe", APP_NAME);
      } else {
        state.authInfo = AUTH_REQUEST_GENERIC_SIGNUP_MESSAGE;
        state.authMode = "login";
      }
    } else {
      const data = await signInRequest(email, password, captchaToken);
      if (operationRevision !== authOperationRevision || state.authMode !== operationMode) {
        if (data?.access_token) void endRecipeAuthSession(data.access_token);
        return;
      }
      state.session = acceptRecipeSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user });
      state.authInfo = "";
      shouldLoadRecipes = await canOpenKiddoSproutApp("recipe", APP_NAME);
    }
  } catch (err) {
    if (operationRevision !== authOperationRevision) return;
    if (operationMode === "signup" && authErrorDisclosesAccountExistence(err)) {
      state.authInfo = AUTH_REQUEST_GENERIC_SIGNUP_MESSAGE;
      state.authError = "";
      state.authMode = "login";
    } else {
      state.authInfo = "";
      state.authError = friendlyAuthError(err);
    }
  } finally {
    if (operationRevision === authOperationRevision) {
      resetAuthHumanCheck();
      state.authSubmitting = false;
      if (shouldLoadRecipes) requestNextAuthFocus("recipe-browse-heading");
      render();
      if (shouldLoadRecipes) await loadRecipes();
    }
  }
}

async function handleRecipePasswordRecovery(email, captchaToken) {
  if (state.authSubmitting) return;
  const operationRevision = ++authOperationRevision;
  state.authEmail = String(email || "").trim().slice(0, 254);
  state.authError = "";
  state.authInfo = "";
  if (!AUTH_EMAIL_DELIVERY_READY) {
    state.authError = EMAIL_DELIVERY_UNAVAILABLE_MESSAGE;
    syncAuthFeedback("auth-error");
    return;
  }
  if (!email) {
    state.authError = "Enter your email first.";
    syncAuthFeedback("auth-email");
    return;
  }
  if (!validRecipeAuthEmail(email)) {
    state.authError = "Enter a complete email address.";
    syncAuthFeedback("auth-email");
    return;
  }
  if (!captchaToken) {
    state.authError = "Confirm you are not a bot before requesting a password reset.";
    syncAuthFeedback("auth-human-check-start");
    return;
  }
  state.authSubmitting = true;
  state.authInfo = "Sending your password reset email…";
  syncAuthFeedback("auth-info");
  updateAuthControls();
  try {
    const transaction = await createRecipePasswordRecoveryTransaction(email);
    await recoverPasswordRequest(email, captchaToken, transaction.nonce);
    if (operationRevision !== authOperationRevision) return;
    state.authInfo = AUTH_REQUEST_GENERIC_RECOVERY_MESSAGE;
  } catch (err) {
    if (operationRevision !== authOperationRevision) return;
    if (authErrorDisclosesAccountExistence(err)) {
      state.authInfo = AUTH_REQUEST_GENERIC_RECOVERY_MESSAGE;
      state.authError = "";
    } else {
      state.authInfo = "";
      state.authError = friendlyAuthError(err);
    }
  } finally {
    if (operationRevision === authOperationRevision) {
      resetAuthHumanCheck();
      state.authSubmitting = false;
      render();
    }
  }
}
