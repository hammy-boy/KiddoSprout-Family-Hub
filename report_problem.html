<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report a Problem - KiddoSprout</title>
  <link rel="icon" type="image/png" href="kiddosprout_logo_128.png">
  <link rel="apple-touch-icon" href="kiddosprout_logo_128.png">
  <style>
    :root {
      --ink: #17202a;
      --muted: #66758a;
      --line: #dce8df;
      --teal: #168b8b;
      --leaf: #6aaa45;
      --coral: #df604a;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 16%, rgba(240, 184, 63, 0.22), transparent 26%),
        radial-gradient(circle at 84% 18%, rgba(52, 111, 159, 0.18), transparent 26%),
        linear-gradient(135deg, #f7fff6, #eef8ff 52%, #fff8ea);
    }

    main {
      width: min(760px, calc(100% - 28px));
      margin: 34px auto;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 24px 70px rgba(24, 34, 45, 0.12);
    }

    .mark {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border-radius: 14px;
      color: white;
      background: linear-gradient(135deg, var(--teal), var(--leaf));
      font-weight: 950;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 58px);
      letter-spacing: 0;
    }

    p {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.45;
    }

    label {
      display: grid;
      gap: 8px;
      margin: 18px 0;
      font-weight: 850;
    }

    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      font: inherit;
      background: white;
    }

    textarea {
      min-height: 170px;
      resize: vertical;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    button,
    a {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      background: #edf4f1;
      text-decoration: none;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    .send {
      color: white;
      background: var(--coral);
    }

    .status {
      min-height: 24px;
      color: var(--teal);
      font-weight: 850;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img class="mark" src="kiddosprout_logo_128.png" alt="" aria-hidden="true">
      <div>
        <h1>KiddoSprout Report Page</h1>
        <p>Type what happened here. This separate page sends the message straight to the parent dashboard.</p>
      </div>
    </div>

    <label>
      Type the problem
      <textarea id="problemText" placeholder="Type what happened here"></textarea>
    </label>

    <label>
      How urgent?
      <select id="problemUrgency">
        <option value="Needs help now">Needs help now</option>
        <option value="Today">Today</option>
        <option value="Can wait">Can wait</option>
      </select>
    </label>

    <p class="status" id="status"></p>

    <div class="actions">
      <button class="send" id="sendReport">Send Problem Report</button>
      <button id="clearReport">Clear</button>
      <a href="index.html#child">Back to Child Site</a>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "kiddosproutState";
    const status = document.querySelector("#status");

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || {};
      } catch (error) {
        return {};
      }
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function currentChildName(state) {
      const child = state.children?.[state.activeChild];
      return child?.name || "Child";
    }

    function sendReport() {
      const state = loadState();
      const child = currentChildName(state);
      const note = document.querySelector("#problemText").value.trim();
      const urgency = document.querySelector("#problemUrgency").value;
      if (!note) {
        status.textContent = "Type what happened first.";
        return;
      }
      const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      state.problemReports ??= [];
      state.safetyAlerts ??= [];
      state.problemReports.unshift({
        child,
        type: note.slice(0, 48),
        urgency,
        note,
        time,
        status: "New"
      });
      state.safetyAlerts.unshift({
        child,
        message: note.slice(0, 48) + " reported" + (urgency === "Needs help now" ? " - urgent" : ""),
        time
      });
      saveState(state);
      status.textContent = "Sent to parent dashboard.";
      document.querySelector("#problemText").value = "";
    }

    document.querySelector("#sendReport").addEventListener("click", sendReport);
    document.querySelector("#clearReport").addEventListener("click", () => {
      document.querySelector("#problemText").value = "";
      document.querySelector("#problemUrgency").value = "Needs help now";
      status.textContent = "Cleared.";
    });
  </script>
</body>
</html>
