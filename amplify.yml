version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci --ignore-scripts --no-audit --no-fund
    build:
      commands:
        - npm run build:public-demo
        - node scripts/include-chess-academy.mjs
        - npm run audit:public-artifact
  artifacts:
    baseDirectory: .cloudflare/public-demo
    files:
      - '**/*'
