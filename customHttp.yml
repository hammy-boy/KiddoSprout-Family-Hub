customHeaders:
  - pattern: '**'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'none'; connect-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; font-src 'self'"
      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin'
      - key: 'Cross-Origin-Resource-Policy'
        value: 'same-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(), display-capture=(), geolocation=(), microphone=()'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'X-Permitted-Cross-Domain-Policies'
        value: 'none'
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
