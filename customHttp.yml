customHeaders:
  - pattern: '**'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; font-src 'self'"
      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin'
      - key: 'Cross-Origin-Resource-Policy'
        value: 'same-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(self), display-capture=(self), geolocation=(), microphone=(self)'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'X-Permitted-Cross-Domain-Policies'
        value: 'none'
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
