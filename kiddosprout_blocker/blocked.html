<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blocked by KiddoSprout</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17202a;
      background:
        radial-gradient(circle at 18% 18%, rgba(240, 184, 63, .3), transparent 27%),
        radial-gradient(circle at 84% 16%, rgba(52, 111, 159, .25), transparent 28%),
        linear-gradient(135deg, #f7fff6, #eef8ff 52%, #fff8ea);
    }
    main {
      width: min(560px, 100%);
      padding: 34px;
      border: 1px solid #dce8df;
      border-radius: 24px;
      background: rgba(255, 255, 255, .95);
      box-shadow: 0 24px 70px rgba(24, 34, 45, .18);
      text-align: center;
    }
    .mark {
      display: inline-grid;
      width: 68px;
      height: 68px;
      place-items: center;
      margin-bottom: 16px;
      border-radius: 20px;
      color: #fff;
      background: linear-gradient(135deg, #168b8b, #6aaa45);
      box-shadow: 0 12px 24px rgba(22, 139, 139, .24);
      font-size: 22px;
      font-weight: 950;
    }
    h1 { margin: 0 0 14px; font-size: clamp(32px, 7vw, 48px); line-height: 1.05; }
    .target { margin: 0 0 8px; color: #315469; font-size: 20px; font-weight: 850; }
    .detail { margin: 0 auto 24px; color: #66758a; font-size: 17px; line-height: 1.5; }
    .scope {
      max-width: 440px;
      margin: 20px auto 0;
      color: #526274;
      font-size: 14px;
      line-height: 1.45;
    }
    button {
      min-height: 44px;
      border: 0;
      border-radius: 14px;
      padding: 13px 20px;
      color: #fff;
      background: #168b8b;
      font: inherit;
      font-weight: 850;
      cursor: pointer;
    }
    button:focus-visible { outline: 4px solid rgba(22, 139, 139, .25); outline-offset: 3px; }
  </style>
</head>
<body>
  <main aria-labelledby="blocked-heading">
    <span class="mark" aria-hidden="true">KS</span>
    <h1 id="blocked-heading">Blocked by KiddoSprout</h1>
    <p class="target" id="blocked-target">This game</p>
    <p class="detail" id="blocked-detail">A parent rule is keeping this space paused.</p>
    <button id="go-back" type="button">Go Back</button>
    <p class="scope">This extension covers websites opened in this Chrome or Edge profile. Installed apps are handled separately by the KiddoSprout computer companion.</p>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
