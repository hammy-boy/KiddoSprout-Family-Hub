<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Create your account — Wisp</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/auth.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <main id="main" class="auth-main">
      <div class="auth-top">
        <a href="./index.html" class="icon-btn" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </a>
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
        </button>
      </div>

      <div class="auth-header">
        <h1>Create your account</h1>
        <p>Sign up with your email address.</p>
      </div>

      <div id="form-banner" class="form-banner" role="alert"></div>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9_.-]{2,31}" required aria-describedby="username-error" />
          <p class="error-msg" id="username-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="identifier" id="identifier-label">Email</label>
          <input type="email" id="identifier" name="identifier" placeholder="you@example.com" autocomplete="email" maxlength="254" required aria-describedby="identifier-error" />
          <p class="error-msg" id="identifier-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="password-error" />
            <button type="button" class="toggle-visibility" id="toggle-password">Show</button>
          </div>
          <p class="error-msg" id="password-error" role="alert"></p>
        </div>

        <div class="human-check-field">
          <p class="human-check-label">Safety check</p>
          <div id="human-check"></div>
          <p id="human-check-status" class="human-check-status" role="status" aria-live="polite" hidden></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="./login.html">Log in</a></p>
    </main>
  </div>

  <script src="/supabase-config.js"></script>
  <script src="/human-check.js"></script>
  <script type="module">
    import { initTheme, wireThemeToggle } from "../scripts/theme.js";
    initTheme();
    wireThemeToggle(document.getElementById("theme-toggle"));
  </script>
  <script type="module" src="../scripts/signup.js"></script>
</body>
</html>
