<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wisp Demo · Fictional chats</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <style>
    body { margin: 0; }
    main { max-width: 1000px; margin: auto; padding: 20px; }
    header, .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    header { justify-content: space-between; }
    .notice { padding: 16px; border: 1px solid #75b6a7; border-radius: 16px; margin: 20px 0; }
    .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; }
    .panel { border: 1px solid #75b6a7; border-radius: 18px; padding: 18px; min-width: 0; }
    button, textarea { font: inherit; }
    button { cursor: pointer; min-height: 44px; border: 1px solid #75b6a7; border-radius: 12px; padding: 10px 14px; }
    .contact { display: block; width: 100%; text-align: left; margin: 10px 0; }
    .contact[aria-pressed="true"] { outline: 3px solid #438b79; }
    #messages { min-height: 230px; max-height: 400px; overflow-y: auto; padding: 0 4px; }
    .message { padding: 12px 16px; margin: 12px 0; border-radius: 15px; background: #e3efe9; color: #193a31; overflow-wrap: anywhere; }
    .message.mine { margin-left: 12%; background: #dce4fa; }
    .message p { margin: 4px 0; white-space: pre-wrap; }
    textarea { width: 100%; min-height: 90px; padding: 12px; border: 1px solid #75b6a7; border-radius: 12px; resize: vertical; background: white; color: #193a31; }
    label { display: block; margin: 14px 0 6px; }
    #call-panel { margin: 16px 0; padding: 16px; border: 1px solid #75b6a7; border-radius: 12px; }
    :focus-visible { outline: 3px solid #8b62d5; outline-offset: 3px; }
    [hidden] { display: none !important; }
    @media (max-width: 620px) { .layout { grid-template-columns: 1fr; } main { padding: 14px; } #contacts { display: flex; flex-wrap: wrap; gap: 8px; } .contact { width: auto; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Wisp demo</h1><div class="actions"><a href="./index.html">Wisp home</a><a href="../../../index.html">KiddoSprout</a><button id="reset" type="button">Reset demo</button></div></header>
    <p class="notice">Fictional contacts and scripted replies. Messages stay in this browser tab. Calls are simulations with no microphone, camera, or real recipient. Use made-up details.</p>
    <div class="layout">
      <aside class="panel"><h2>Demo contacts</h2><div id="contacts" role="group" aria-label="Choose a fictional contact"></div></aside>
      <section class="panel" aria-labelledby="chat-title">
        <h2 id="chat-title" tabindex="-1"></h2>
        <div class="actions"><button id="voice" type="button">Simulate voice call</button><button id="video" type="button">Simulate video call</button></div>
        <div id="call-panel" hidden><p id="call-state" role="status" aria-live="polite"></p><div class="actions"><button id="answer" type="button">Simulate answer</button><button id="mute" type="button" aria-pressed="false" disabled>Mute simulation</button><button id="end" type="button">End simulation</button></div></div>
        <div id="messages" role="log" aria-label="Demo conversation" aria-live="polite" aria-relevant="additions"></div>
        <form id="message-form"><label for="message">Write a demo message</label><textarea id="message" maxlength="600" required placeholder="Try a made-up message…"></textarea><div class="actions"><button type="submit">Send demo message</button><button id="sample" type="button">Use sample message</button></div></form>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
    </div>
  </main>
  <script type="module" src="../scripts/demo.js"></script>
</body>
</html>
