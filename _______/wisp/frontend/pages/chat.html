<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chat — Wisp</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/screens.css" />
  <link rel="stylesheet" href="../styles/chat.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <header class="chat-header">
      <a href="./home.html" class="icon-btn" aria-label="Back to chats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <div class="avatar avatar-sm" id="chat-avatar">—</div>
      <div class="chat-header-info">
        <div class="chat-header-name" id="chat-name">Contact</div>
        <div class="chat-header-status" id="chat-status">Online</div>
      </div>
      <div class="chat-header-actions">
        <button class="icon-btn" id="voice-call-btn" aria-label="Voice call">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8 9.9a16 16 0 0 0 6 6l1.4-1.4a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.8 2.2Z"/></svg>
        </button>
        <button class="icon-btn" id="video-call-btn" aria-label="Video call">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 10.5V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-3.5l5 4v-11l-5 4Z"/></svg>
        </button>
      </div>
    </header>

    <div id="load-banner" class="form-banner error" style="margin: var(--sp-3) var(--sp-4) 0;"></div>

    <main id="chat-body" class="chat-body"></main>

    <form class="chat-composer" id="composer-form">
      <div class="composer-input-wrap">
        <label for="composer-textarea" class="visually-hidden">Message</label>
        <textarea id="composer-textarea" rows="1" placeholder="Message" maxlength="4000"></textarea>
      </div>
      <button type="submit" class="composer-send" id="composer-send" disabled aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/></svg>
      </button>
    </form>
  </div>

  <!-- Call overlay: covers the screen during an active or incoming call.
       Calling only works while both people have this chat open — there's
       no background ringing when the app/tab is closed (that needs push
       notifications and a native app shell, which is out of scope for
       this web MVP). -->
  <div class="call-overlay" id="call-overlay" role="dialog" aria-modal="true" aria-label="Call">
    <div class="call-error-banner" id="call-error-banner"></div>
    <video class="remote-video" id="remote-video" autoplay playsinline></video>
    <video class="local-video" id="local-video" autoplay playsinline muted></video>

    <div class="call-overlay-identity">
      <div class="avatar avatar-lg" id="call-avatar">—</div>
      <div class="call-overlay-name" id="call-name">Contact</div>
      <div class="call-overlay-status" id="call-status">Calling…</div>
    </div>

    <div class="call-overlay-controls">
      <!-- Shown while ringing on the receiving end -->
      <div class="incoming-call-actions" id="incoming-actions" style="display:none;">
        <button class="call-control-btn" id="decline-btn" aria-label="Decline call">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(135)"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8 9.9a16 16 0 0 0 6 6l1.4-1.4a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.8 2.2Z"/></svg>
        </button>
        <button class="call-control-btn is-accept" id="accept-btn" aria-label="Accept call">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8 9.9a16 16 0 0 0 6 6l1.4-1.4a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.8 2.2Z"/></svg>
        </button>
      </div>

      <!-- Shown once a call is active (outgoing, ringing-out, or connected) -->
      <div class="call-controls" id="active-controls" style="display:none;">
        <button class="call-control-btn" id="mute-btn" aria-label="Mute microphone" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v7a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 19v3"/></svg>
        </button>
        <button class="call-control-btn is-hangup" id="hangup-btn" aria-label="End call">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(135)"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8 9.9a16 16 0 0 0 6 6l1.4-1.4a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.8 2.2Z"/></svg>
        </button>
        <button class="call-control-btn" id="camera-btn" aria-label="Turn camera off" aria-pressed="false" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 10.5V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-3.5l5 4v-11l-5 4Z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="/supabase-config.js"></script>
  <script type="module" src="../scripts/chat.js"></script>
</body>
</html>
