<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reset password — Wisp</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/auth.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <main id="main" class="auth-main">
      <div class="auth-top">
        <a href="./login.html" class="icon-btn" aria-label="Back to log in">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </a>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch colour theme">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
        </button>
      </div>

      <div class="auth-header">
        <h1>Choose a new password</h1>
        <p>This form opens only from a valid password-reset email.</p>
      </div>

      <div id="form-banner" class="form-banner is-visible" role="status" aria-live="polite" aria-atomic="true">Checking your reset link…</div>

      <form id="reset-password-form" novalidate hidden>
        <div class="field">
          <label for="password">New password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="password-error" />
            <button type="button" class="toggle-visibility" id="toggle-password" aria-controls="password">Show</button>
          </div>
          <p class="error-msg" id="password-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="password-confirm">Confirm new password</label>
          <div class="input-wrap">
            <input type="password" id="password-confirm" name="password-confirm" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="password-confirm-error" />
            <button type="button" class="toggle-visibility" id="toggle-password-confirm" aria-controls="password-confirm">Show</button>
          </div>
          <p class="error-msg" id="password-confirm-error" role="alert"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Save new password</button>
      </form>

      <p class="auth-switch"><a href="./login.html" id="return-to-login">Return to log in</a></p>
    </main>
  </div>

  <script src="/supabase-config.js"></script>
  <script type="module">
    import { initTheme, wireThemeToggle } from "../scripts/theme.js";
    initTheme();
    wireThemeToggle(document.getElementById("theme-toggle"));
  </script>
  <script type="module" src="../scripts/resetPassword.js"></script>
</body>
</html>
