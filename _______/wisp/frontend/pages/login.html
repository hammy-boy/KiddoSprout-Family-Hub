<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Log in — Wisp</title>
  <link rel="stylesheet" href="../styles/tokens.css" />
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="../styles/auth.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <main id="main" class="auth-main">
      <div class="auth-top">
        <a href="./index.html" class="icon-btn" aria-label="Back">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </a>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch colour theme">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
        </button>
      </div>

      <div class="auth-header">
        <h1>Welcome back</h1>
        <p>Log in to pick up your conversations.</p>
      </div>

      <div id="form-banner" class="form-banner" role="alert" aria-live="assertive" aria-atomic="true"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="identifier" id="identifier-label">Email</label>
          <input type="email" id="identifier" name="identifier" placeholder="you@example.com" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="254" required aria-describedby="identifier-error" />
          <p class="error-msg" id="identifier-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" maxlength="128" required aria-describedby="password-error" />
            <button type="button" class="toggle-visibility" id="toggle-password" aria-controls="password">Show</button>
          </div>
          <p class="error-msg" id="password-error" role="alert"></p>
        </div>

        <a href="#" class="forgot-link" id="forgot-password-link">Forgot password?</a>

        <div class="human-check-field" role="group" aria-labelledby="safety-check-label">
          <p class="human-check-label" id="safety-check-label">Safety check</p>
          <div id="human-check"></div>
          <p id="human-check-status" class="human-check-status" role="status" aria-live="polite" hidden></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="./signup.html">Sign up</a></p>
    </main>
  </div>

  <script src="/supabase-config.js"></script>
  <script src="/human-check.js"></script>
  <script type="module">
    import { initTheme, wireThemeToggle } from "../scripts/theme.js";
    initTheme();
    wireThemeToggle(document.getElementById("theme-toggle"));
  </script>
  <script type="module" src="../scripts/login.js"></script>
</body>
</html>
